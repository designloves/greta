<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Poppins — vocabulary tutor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#2A2530;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',system-ui,sans-serif;}

/* ── Gummy Tech tokens ── */
:root{
  --paper:#F4F1E8; --paper-alt:#E9E4D2;
  --ink:#241F3D;   --ink-soft:#6B638A;
  --pink:#B583E8;  --pink-soft:#E5D4F7;
  --butter:#F2EE5B;--butter-soft:#FBF8B0;
  --sky:#8AD7FF;   --sky-soft:#D6F0FF;
  --mint:#A8F08C;  --mint-soft:#DFF7CE;
  --rose:#FFB0C8;
  --correct:#A8F08C; --wrong:#F46B7C;
  --radius:26px; --radius-lg:34px;
  --border:2.5px solid #241F3D;
  --border-thin:2px solid #241F3D;
  --shadow:0 6px 0 #241F3D;
  --shadow-lg:0 10px 0 #241F3D;
  --h-font:'Bricolage Grotesque',system-ui,sans-serif;
  --b-font:'Space Grotesk',system-ui,sans-serif;
  --m-font:'JetBrains Mono',ui-monospace,monospace;
}

/* ── Phone frame ── */
#frame{
  width:360px;height:720px;background:var(--paper-alt);
  border:4px solid var(--ink);border-radius:44px;
  overflow:hidden;box-shadow:var(--shadow-lg);
  position:relative;flex-shrink:0;
}
#notch{
  position:absolute;top:14px;left:50%;transform:translateX(-50%);
  width:90px;height:22px;background:var(--ink);border-radius:999px;z-index:20;
}
#shell{width:100%;height:100%;border-radius:36px;overflow:hidden;display:flex;flex-direction:column;}
#statusbar{
  height:46px;flex-shrink:0;display:flex;align-items:flex-end;
  justify-content:space-between;padding:0 24px 6px;
  font-family:var(--m-font);font-weight:700;font-size:13px;
  color:var(--ink);background:var(--paper);
}
#statusbar .sb-right{display:flex;align-items:center;gap:6px;}
#screen{flex:1;min-height:0;overflow-y:auto;background:var(--paper);position:relative;}

/* ── Cards ── */
.card{background:var(--paper);border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;}
.card-lg{background:var(--paper);border:var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:20px;}

/* ── Buttons ── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:var(--border);border-radius:var(--radius);
  font-family:var(--b-font);font-size:16px;font-weight:700;
  letter-spacing:-0.01em;cursor:pointer;outline:none;
  transition:transform 80ms,box-shadow 80ms;
  padding:12px 20px;
}
.btn:disabled{opacity:0.5;cursor:not-allowed;}
.btn-primary{background:var(--pink);color:#fff;box-shadow:0 4px 0 var(--ink);}
.btn-secondary{background:var(--butter);color:var(--ink);box-shadow:0 4px 0 var(--ink);}
.btn-tertiary{background:var(--paper);color:var(--ink);box-shadow:0 4px 0 var(--ink);}
.btn-lg{padding:16px 24px;font-size:18px;box-shadow:0 6px 0 var(--ink) !important;}
.btn-full{width:100%;}
.btn:not(:disabled):active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink) !important;}
.btn-sm{padding:8px 14px;font-size:14px;}

/* ── Icon-btn (round) ── */
.icon-btn{
  background:var(--paper-alt);border:var(--border-thin);border-radius:999px;
  width:38px;height:38px;cursor:pointer;display:flex;align-items:center;justify-content:center;outline:none;
}
.icon-btn-sm{width:34px;height:34px;}
.icon-btn-xs{width:36px;height:36px;}

/* ── Inputs ── */
.inp{
  width:100%;padding:14px 18px;border:var(--border);border-radius:var(--radius);
  font-family:var(--b-font);font-size:16px;background:var(--paper);color:var(--ink);
  outline:none;box-shadow:inset 0 2px 0 var(--paper-alt);
}
.inp:focus{box-shadow:inset 0 2px 0 var(--paper-alt),0 0 0 3px var(--pink-soft);}
.inp-correct{background:var(--mint-soft)!important;}
.inp-wrong{background:var(--pink-soft)!important;}
.inp-mono{font-family:var(--m-font);font-size:14px;resize:none;line-height:1.6;}
.inp-header{font-family:var(--h-font);font-size:18px;}

/* ── Typography helpers ── */
.h-font{font-family:var(--h-font);}
.b-font{font-family:var(--b-font);}
.m-font{font-family:var(--m-font);}
.ink-soft{color:var(--ink-soft);}
.label-caps{font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-soft);}

/* ── Screen layout ── */
.screen-pad{padding:20px 22px 24px;display:flex;flex-direction:column;gap:18px;min-height:100%;}
.screen-pad-sm{padding:16px 20px 20px;display:flex;flex-direction:column;gap:14px;min-height:100%;}

/* ── Dot progress bar ── */
.dotbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.dot{height:10px;border-radius:6px;border:2px solid var(--ink);background:var(--paper-alt);transition:all 200ms;}
.dot-current{width:28px;background:var(--butter);}
.dot-done{width:10px;background:var(--mint);}
.dot-future{width:10px;}

/* ── Pair chip ── */
.pair-chip{
  display:flex;align-items:center;gap:6px;
  background:var(--paper);border:var(--border);border-radius:999px;
  padding:5px 10px 5px 6px;cursor:pointer;outline:none;
  box-shadow:0 2px 0 var(--ink);
  font-family:var(--m-font);font-size:12px;font-weight:700;color:var(--ink);
}
.lang-circle{
  width:18px;height:18px;border-radius:999px;border:var(--border-thin);
  display:inline-flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:800;color:var(--ink);
}

/* ── Animations ── */
@keyframes greta-spin{to{transform:rotate(360deg);}}
@keyframes bloom-spin{to{transform:rotate(360deg);}}
@keyframes greta-fall{0%{transform:translateY(-40px) rotate(0deg);opacity:1;}90%{opacity:1;}100%{transform:translateY(820px) rotate(360deg);opacity:0;}}
@keyframes greta-float{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-12px) rotate(8deg);}}
@keyframes greta-kiss{
  0%  {transform:translate(0,0) scale(1) rotate(0);}
  20% {transform:translate(-30px,-30px) scale(1.1) rotate(-8deg);}
  40% {transform:translate(-58px,-78px) scale(1.25) rotate(-14deg);}
  55% {transform:translate(-62px,-88px) scale(1.3) rotate(-14deg);}
  70% {transform:translate(-58px,-78px) scale(1.2) rotate(-10deg);}
  100%{transform:translate(-20px,-20px) scale(1) rotate(0);opacity:.95;}
}
@keyframes greta-oops{
  0%,100%{transform:rotate(0);}
  15%{transform:translate(-8px,2px) rotate(-7deg);}
  30%{transform:translate(8px,2px) rotate(7deg);}
  45%{transform:translate(-7px,0) rotate(-6deg);}
  60%{transform:translate(7px,0) rotate(6deg);}
  75%{transform:translate(-4px,0) rotate(-3deg);}
}
@keyframes greta-heart-burst{
  0%  {transform:scale(0) rotate(-12deg);opacity:0;}
  35% {transform:scale(1.4) rotate(-6deg);opacity:1;}
  65% {transform:scale(1.1) rotate(2deg);opacity:1;}
  100%{transform:scale(.9) translateY(-18px) rotate(8deg);opacity:0;}
}
@keyframes greta-card-correct{0%{transform:scale(1);}35%{transform:scale(1.018);}100%{transform:scale(1);}}
@keyframes greta-card-wrong{0%,100%{transform:translateX(0);}20%{transform:translateX(-7px);}40%{transform:translateX(7px);}60%{transform:translateX(-5px);}80%{transform:translateX(5px);}}
@keyframes greta-tada{
  0%  {transform:scale(1) rotate(0);}10%{transform:scale(.92) rotate(-6deg);}
  20%,40%,60%,80%{transform:scale(1.18) rotate(8deg);}
  30%,50%,70%    {transform:scale(1.18) rotate(-8deg);}
  100%{transform:scale(1) rotate(0);}
}
@keyframes greta-bigbounce{
  0%  {transform:translate(0,0) scale(1,1);}
  18% {transform:translate(0,-70px) scale(.94,1.12);}
  38% {transform:translate(0,0) scale(1.12,.86);}
  55% {transform:translate(0,-32px) scale(.97,1.06);}
  72% {transform:translate(0,0) scale(1.05,.95);}
  100%{transform:translate(0,0) scale(1,1);}
}
@keyframes greta-cartwheel{
  0%  {transform:translate(0,0) rotate(0) scale(1);}
  30% {transform:translate(-30px,-50px) rotate(-200deg) scale(.9);}
  60% {transform:translate(-60px,-40px) rotate(-380deg) scale(1);}
  100%{transform:translate(-20px,-10px) rotate(-360deg) scale(.95);}
}
@keyframes greta-sink{
  0%  {transform:translate(0,0) scale(1,1);}
  20% {transform:translate(0,6px) scale(1.05,.8);}
  40% {transform:translate(0,-2px) scale(.95,1.08);}
  60% {transform:translate(0,5px) scale(1.04,.86);}
  100%{transform:translate(0,0) scale(1,1);}
}
@keyframes greta-headtilt{0%{transform:rotate(0);}25%{transform:rotate(-22deg) translateX(-4px);}65%{transform:rotate(-22deg) translateX(-4px);}100%{transform:rotate(0);}}
@keyframes greta-spin-shrink{0%{transform:rotate(0) scale(1);}50%{transform:rotate(-540deg) scale(.55);}100%{transform:rotate(-720deg) scale(1);}}
@keyframes greta-sparkle-arc{
  0%  {transform:translate(0,0) scale(0) rotate(0);opacity:0;}
  30% {transform:translate(var(--dx,0px),var(--dy,0px)) scale(1.2) rotate(45deg);opacity:1;}
  100%{transform:translate(calc(var(--dx,0px)*1.7),calc(var(--dy,0px)*1.7 - 8px)) scale(.6) rotate(110deg);opacity:0;}
}
@keyframes greta-confetti-rain{
  0%  {transform:translate(var(--cdx,0px),-30px) rotate(0);opacity:0;}
  10% {opacity:1;}
  100%{transform:translate(calc(var(--cdx,0px) + var(--cdx2,0px)),320px) rotate(720deg);opacity:0;}
}
@keyframes greta-petal-trail{
  0%  {transform:translate(0,0) scale(0) rotate(0);opacity:0;}
  25% {transform:translate(var(--dx,0),var(--dy,0)) scale(1) rotate(var(--rot,0deg));opacity:1;}
  100%{transform:translate(calc(var(--dx,0)*1.4),calc(var(--dy,0)*1.4 + 24px)) scale(.6) rotate(calc(var(--rot,0deg) + 120deg));opacity:0;}
}
@keyframes greta-droplet-fall{0%{transform:scale(0);opacity:0;}20%{transform:scale(1);opacity:1;}100%{transform:translateY(28px) scale(.8);opacity:0;}}
@keyframes greta-qmark-pop{0%{transform:scale(0) rotate(-20deg);opacity:0;}35%{transform:scale(1.3) rotate(8deg);opacity:1;}100%{transform:scale(1.15) translateY(-12px) rotate(0);opacity:0;}}
@keyframes greta-puff{0%{transform:scale(0);opacity:0;}40%{transform:scale(1.2);opacity:.85;}100%{transform:scale(1.6);opacity:0;}}
@keyframes greta-answer-rise{from{transform:translateY(14px);opacity:0;}to{transform:translateY(0);opacity:1;}}
@keyframes pop-in{from{transform:scale(.92);opacity:0;}to{transform:scale(1);opacity:1;}}

::-webkit-scrollbar{width:0;height:0;}
input,textarea,button{font:inherit;}
svg{display:block;}
</style>

<script>

const SUPABASE_URL     = 'https://ivcnjkzuggwpxvnalbol.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_nvKqUBjP0B-TmROc_aJtdA_U-P0pr_u';

// ── LANGUAGES ─────────────────────────────────────────────────────
const LANGUAGES = {

// ── SVG ICONS (strings) ───────────────────────────────────────────
const SVG={

// ── AUTH ──────────────────────────────────────────────────────────
let currentUser=null, sessionToken=null;

function parseJWT(t){try{return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));}catch{return null;}}
function tokenExpired(t){const p=parseJWT(t);return!p?.exp||Date.now()/1000>p.exp-60;}
function saveSession(t,r){try{localStorage.setItem("greta_session",JSON.stringify({token:t,refresh:r}));}catch{}}
function clearSession(){try{localStorage.removeItem("greta_session");}catch{}currentUser=null;sessionToken=null;}

function applySession(token,refresh){
  const p=parseJWT(token);
  currentUser=p?{id:p.sub,email:p.email}:null;
  sessionToken=token;
  saveSession(token,refresh);
}

async function initAuth(){
  const params=new URLSearchParams(location.hash.substring(1));
  const ht=params.get("access_token"), hr=params.get("refresh_token");
  if(ht){applySession(ht,hr);try{history.replaceState(null,"",location.pathname+location.search);}catch{}return;}
  try{
    const saved=localStorage.getItem("greta_session");
    if(!saved)return;
    let{token,refresh}=JSON.parse(saved);
    if(tokenExpired(token)&&refresh){
      const res=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`,{
        method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_ANON_KEY},
        body:JSON.stringify({refresh_token:refresh}),
      });
      if(!res.ok){clearSession();return;}
      const d=await res.json();token=d.access_token;refresh=d.refresh_token;
    }else if(tokenExpired(token)){clearSession();return;}
    applySession(token,refresh);
  }catch{clearSession();}
}

function pairLists(){return state.lists.filter(l=>(l.from||"sv")===state.pair.from&&(l.to||"en")===state.pair.to);}
function activeList(){return state.lists.find(l=>l.id===state.activeListId);}

// ── AUTH ACTIONS ──────────────────────────────────────────────────
async function sendMagicLink(){
  const email=state.loginEmail.trim();
  if(!email.includes("@")){setState({loginErr:"Enter a valid email"});return;}
  setState({loginErr:"",loginLoading:true});
  try{
    const res=await fetch(`${SUPABASE_URL}/auth/v1/otp`,{
      method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_ANON_KEY},
      body:JSON.stringify({email,create_user:true,options:{emailRedirectTo:location.href.split("#")[0]}}),
    });
    if(!res.ok){const d=await res.json();throw new Error(d.msg||d.error_description||"Could not send link");}
    setState({loginSent:true,loginLoading:false});
  }catch(e){setState({loginErr:e.message||"Could not send link",loginLoading:false});}
}

async function loadUserLists(){
  if(!sessionToken)return;
  try{
    const res=await fetch(`${API}/sets`,{headers:{"Authorization":`Bearer ${sessionToken}`}});
    if(!res.ok)return;
    const sets=await res.json();
    const COLORS=["rose","butter","sky","mint","pink"];
    const mapped=sets.map((s,i)=>({
      id:s.id,name:s.topic,color:COLORS[i%COLORS.length],
      words:(s.vocab||[]).map(p=>({sv:p.sv,en:typeof p.en==="string"&&p.en.includes("|")?p.en.split("|").map(x=>x.trim()):p.en})),
      from:"sv",to:"en",
    }));
    if(mapped.length>0)setState({lists:mapped,activeListId:mapped[0].id});
  }catch{}
}

async function saveList(newList){
  const words=newList.words.map(w=>({sv:w[newList.from]||w.sv,en:w[newList.to]||w.en}));
  if(!sessionToken){
    setState({lists:[...state.lists,newList],activeListId:newList.id,screen:"home"});
    return;
  }
  try{
    const res=await fetch(`${API}/sets`,{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":`Bearer ${sessionToken}`},
      body:JSON.stringify({topic:newList.name,vocab:words}),
    });
    const saved=await res.json();
    if(!res.ok)throw new Error(saved.error||"Save failed");
    const stamped={...newList,id:saved.id};
    setState({lists:[...state.lists,stamped],activeListId:stamped.id,screen:"home"});
  }catch{
    setState({lists:[...state.lists,newList],activeListId:newList.id,screen:"home"});
  }
}

async function deleteList(list){
  if(sessionToken){
    fetch(`${API}/sets/${list.id}`,{method:"DELETE",headers:{"Authorization":`Bearer ${sessionToken}`}}).catch(()=>{});
  }
  const newLists=state.lists.filter(x=>x.id!==list.id);
  setState({lists:newLists,activeListId:state.activeListId===list.id?null:state.activeListId});
}

async function signOut(){
  if(sessionToken){
    fetch(`${SUPABASE_URL}/auth/v1/logout`,{method:"POST",headers:{"apikey":SUPABASE_ANON_KEY,"Authorization":`Bearer ${sessionToken}`}}).catch(()=>{});
  }
  clearSession();
  setState({lists:[...SAMPLE_LISTS],activeListId:"djur",screen:"home"});
}

// ── QUIZ LOGIC ────────────────────────────────────────────────────
const ANIM_CORRECT=["kiss","tada","bigbounce","cartwheel"];
const ANIM_WRONG  =["shake","sink","headtilt","spin"];

function quizSubmit(){
  const list=activeList(); if(!list||state.quizFeedback)return;
  const answer=state.quizAnswer.trim(); if(!answer)return;
  const lh=langHelpers(list);
  const word=list.words[state.quizIdx];
  const ok=answer.toLowerCase()===lh.tgt(word).toLowerCase();
  const pool=ok?ANIM_CORRECT:ANIM_WRONG;
  const anim=pool[Math.floor(Math.random()*pool.length)];
  if(ok){
    setState({quizRight:state.quizRight+1,quizFeedback:"correct",quizAnim:anim});
    setTimeout(quizAdvance,1200);
  }else{
    setState({quizWrong:state.quizWrong+1,quizFeedback:"wrong",quizAnim:anim});
    setTimeout(()=>setState({quizWriteMode:true}),1400);
  }
}

function quizAdvance(){
  const list=activeList(); if(!list)return;
  const nextIdx=state.quizIdx+1;
  if(nextIdx>=list.words.length){
    setState({screen:"done",result:{right:state.quizRight,wrong:state.quizWrong,total:list.words.length}});
    return;
  }
  setState({quizIdx:nextIdx,quizAnswer:"",quizFeedback:null,quizAnim:null,quizWriteMode:false,quizReps:["","","","",""]});
  setTimeout(()=>document.getElementById("quiz-input")?.focus(),50);
}

function write5Check(i,val){
  const list=activeList(); if(!list)return;
  const lh=langHelpers(list);
  const word=list.words[state.quizIdx];
  const target=lh.tgt(word).toLowerCase();
  const newReps=[...state.quizReps]; newReps[i]=val; setState({quizReps:newReps});
  if(val.trim().toLowerCase()===target&&i<4){
    setTimeout(()=>document.getElementById(`w5-${i+1}`)?.focus(),100);
  }
}

function parsePasteText(text,pair){
  const lines=text.split("\n").map(l=>l.trim()).filter(Boolean);
  const out=[];
  for(const line of lines){
    const m=line.match(/^(.+?)\s*[=\-–→:\t]+\s*(.+)$/);
    if(m){out.push({[pair.from]:m[1].trim(),[pair.to]:m[2].trim()});}
    else if(line.split(/\s{2,}/).length===2){
      const[a,b]=line.split(/\s{2,}/);
      out.push({[pair.from]:a.trim(),[pair.to]:b.trim()});
    }
  }
  return out;
}

}

  const list=activeList(); if(!list)return screens.home();
  const {quizIdx,quizRight,quizWrong,quizAnswer,quizFeedback,quizAnim,quizWriteMode,quizReps}=state;
  const lh=langHelpers(list), word=list.words[quizIdx], total=list.words.length;

  if(quizWriteMode){
    const target=lh.tgt(word);
    const rows=quizReps.map((r,i)=>{
      const ok=r.trim().toLowerCase()===target.toLowerCase();
      return `
        <div style="display:flex;align-items:center;gap:10px;">
          <div style="width:30px;height:30px;border-radius:999px;border:var(--border-thin);background:${ok?"var(--correct)":"var(--paper-alt)"};display:flex;align-items:center;justify-content:center;font-family:var(--m-font);font-size:13px;font-weight:700;color:${ok?"#fff":"var(--ink)"};flex-shrink:0;">
            ${ok?SVG.check(14,"#fff",4):i+1}
          </div>
          <input id="w5-${i}" class="inp" value="${r}" ${ok?"disabled":""} placeholder="${i===0?target:""}"
            style="background:${ok?"var(--mint-soft)":"var(--paper)"};opacity:${ok?.7:1};" data-w5="${i}"/>
        </div>`; }).join("");
    const done=quizReps.filter((r,_)=>r.trim().toLowerCase()===target.toLowerCase()).length;
    return `
      <div class="screen-pad">
        <div style="text-align:center;">
          <div class="label-caps">Practice</div>
          <h2 class="h-font" style="font-size:28px;color:var(--ink);margin:4px 0 0;letter-spacing:-0.02em;">
            Write "<span style="color:var(--pink);">${target}</span>" 5 times
          </h2>
          <p class="b-font" style="color:var(--ink-soft);font-size:13px;margin-top:6px;">(${lh.src(word)} in ${lh.srcLang})</p>
        </div>
        <div style="display:flex;justify-content:center;">${mascotSVG(80,"thinking")}</div>
        <div style="display:flex;flex-direction:column;gap:8px;flex:1;">${rows}</div>
        <button id="w5-done" class="btn btn-primary btn-lg btn-full" ${done<5?"disabled":""}>
          ${done===5?`Got it — keep going ${SVG.arrowRight(18,"#fff")}`:done+" / 5 done"}
        </button>
      </div>`;
  }

  // dots
  const dots=Array.from({length:total}).map((_,i)=>{
    let cls="dot";if(i<quizIdx)cls+=" dot-done";else if(i===quizIdx)cls+=" dot-current";else cls+=" dot-future";
    return `<div class="${cls}"></div>`;}).join("");

  const fbBg=quizFeedback==="correct"?"var(--mint-soft)":quizFeedback==="wrong"?"var(--pink-soft)":"var(--paper)";
  const cardAnim=quizFeedback==="correct"?"greta-card-correct 700ms ease-out":quizFeedback==="wrong"?"greta-card-wrong 480ms ease-in-out":"none";
  const mascotMood=quizFeedback==="correct"?(quizAnim==="tada"?"proud":"cheer"):quizFeedback==="wrong"?"oops":"happy";

  // mascot position & animation
  const isKiss=quizAnim==="kiss";
  const mascotStyle=isKiss
    ?`position:absolute;bottom:14px;right:50%;margin-right:-36px;transform-origin:center bottom;animation:${quizFeedback?`greta-kiss 1100ms cubic-bezier(.4,1.4,.6,1) both`:"none"};z-index:3;`
    :`position:absolute;bottom:-8px;right:-8px;transform-origin:center bottom;animation:${quizFeedback?`${animName(quizAnim)} both`:"none"};z-index:3;`;

  const burst=feedbackBurst(quizFeedback,quizAnim);

  const wrongAnswer=quizFeedback==="wrong"?`<div class="h-font" style="font-size:30px;color:var(--wrong);animation:greta-answer-rise 360ms ease-out both;">= ${lh.tgt(word)}</div>`:"";
  const hint=!quizFeedback?`<div style="height:1px;width:40px;background:var(--ink);opacity:.2;"></div><div class="b-font" style="font-size:14px;color:var(--ink);opacity:.7;">What does this mean in ${lh.tgtLang}?</div>`:"";
  const inpBg=quizFeedback==="correct"?"var(--mint-soft)":quizFeedback==="wrong"?"var(--pink-soft)":"var(--paper)";

  return `
    <div class="screen-pad-sm">
      <div style="display:flex;align-items:center;gap:10px;">
        <button id="quiz-exit" class="icon-btn-sm">${SVG.arrowBack(14,"#241F3D")}</button>
        <div style="flex:1;display:flex;flex-direction:column;gap:4px;">
          <div class="dotbar">${dots}</div>
          <div style="display:flex;justify-content:space-between;font-family:var(--m-font);font-size:11px;color:var(--ink-soft);">
            <span>${quizIdx+1} / ${total}</span>
            <span style="display:flex;gap:10px;">
              <span style="color:var(--correct);font-weight:700;">✓${quizRight}</span>
              <span style="color:var(--wrong);font-weight:700;">✗${quizWrong}</span>
            </span>
          </div>
        </div>
      </div>
      <div class="card-lg" style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px;background:${fbBg};transition:background 250ms;position:relative;overflow:hidden;animation:${cardAnim};">
        <div style="display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;">
          <div class="label-caps">${lh.srcLang}</div>
          <div class="h-font" style="font-size:54px;line-height:.95;color:var(--ink);letter-spacing:-.03em;word-break:break-word;">${lh.src(word)}</div>
          ${wrongAnswer}${hint}
        </div>
        ${burst}
        <div style="${mascotStyle}">${mascotSVG(86,mascotMood)}</div>
      </div>
      <input id="quiz-input" class="inp" value="${quizAnswer}" placeholder="type in ${lh.tgtLang}, then press enter…"
        style="font-size:18px;font-weight:600;background:${inpBg};transition:background 250ms;text-align:${quizFeedback?"center":"left"};"
        ${quizFeedback?"disabled":""}/>
    </div>`;
},

done(){
  const r=state.result||{right:0,wrong:0,total:1};
  const pct=Math.round((r.right/r.total)*100);
  const stars=pct>=90?3:pct>=60?2:1;
  const colors=["#FFB0C8","#F2EE5B","#8AD7FF","#A8F08C","#B583E8"];
  const pieces=Array.from({length:24}).map((_,i)=>({color:colors[i%colors.length],left:(i*37)%100,delay:(i*80)%1500,rot:(i*47)%360}));
  const confetti=pieces.map(p=>`<div style="position:absolute;top:-20px;left:${p.left}%;animation:greta-fall 3s ${p.delay}ms infinite linear;">${SVG.confetti(10,p.color,p.rot)}</div>`).join("");
  const starBtns=[1,2,3].map(s=>`
    <div style="width:50px;height:50px;border-radius:999px;background:${s<=stars?"var(--butter)":"var(--paper-alt)"};border:var(--border);display:flex;align-items:center;justify-content:center;transform:scale(${s<=stars?1:.85});box-shadow:${s<=stars?`0 4px 0 var(--ink)`:"none"};">
      ${SVG.spark(26,s<=stars?"#241F3D":"#6B638A")}
    </div>`).join("");
  return `
    <div style="padding:32px 22px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;min-height:100%;justify-content:center;position:relative;overflow:hidden;">
      ${confetti}
      ${mascotSVG(150,"proud")}
      <div style="display:flex;gap:6px;">${starBtns}</div>
      <div>
        <h1 class="h-font" style="font-size:44px;color:var(--ink);letter-spacing:-.03em;line-height:1;">You did it!</h1>
        <p class="b-font" style="color:var(--ink-soft);font-size:16px;margin-top:8px;">
          ${pct}% right · <span class="m-font">${r.right}/${r.total}</span> on the first try
        </p>
      </div>
      <div style="display:flex;gap:10px;width:100%;">
        <button id="done-home" class="btn btn-tertiary">Home</button>
        <button id="done-again" class="btn btn-primary" style="flex:1;">Play again ${SVG.arrowRight(16,"#fff")}</button>
      </div>
    </div>`;
},

settings(){
  const pair=state.pair;
  return `
    <div class="screen-pad">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h2 class="h-font" style="font-size:30px;color:var(--ink);">Settings</h2>
        <button id="settings-close" class="icon-btn-xs">${SVG.cross(16,"#241F3D",3)}</button>
      </div>
      <div class="card" style="background:var(--pink-soft);">
        <div style="display:flex;align-items:center;gap:14px;">
          <div style="width:56px;height:56px;border-radius:999px;background:var(--paper);border:var(--border-thin);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            ${mascotSVG(48,"happy")}
          </div>
          <div>
            <div class="h-font" style="font-size:18px;color:var(--ink);">Hej there!</div>
            <div class="m-font" style="font-size:12px;color:var(--ink-soft);">${currentUser?.email||"Not signed in"}</div>
          </div>
        </div>
      </div>
      <div>
        <div class="label-caps" style="margin-bottom:8px;">Language</div>
        <div id="settings-lang" class="card" style="padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;">
          <span style="width:32px;height:32px;border-radius:999px;border:var(--border);background:${LANGUAGES[pair.from]?.color||"#ccc"};display:inline-flex;align-items:center;justify-content:center;font-family:var(--m-font);font-size:11px;font-weight:800;">${LANGUAGES[pair.from]?.code||"SV"}</span>
          ${SVG.arrowRight(14,"#241F3D")}
          <span style="width:32px;height:32px;border-radius:999px;border:var(--border);background:${LANGUAGES[pair.to]?.color||"#ccc"};display:inline-flex;align-items:center;justify-content:center;font-family:var(--m-font);font-size:11px;font-weight:800;">${LANGUAGES[pair.to]?.code||"EN"}</span>
          <div style="flex:1;margin-left:4px;">
            <div class="b-font" style="font-weight:600;font-size:14px;color:var(--ink);">${LANGUAGES[pair.from]?.name||"Swedish"} → ${LANGUAGES[pair.to]?.name||"English"}</div>
            <div class="m-font" style="font-size:11px;color:var(--ink-soft);">Tap to change</div>
          </div>
        </div>
      </div>
      <div>
        <div class="label-caps" style="margin-bottom:8px;">Practice</div>
        <div class="card" style="padding:0;overflow:hidden;">
          ${[["Daily reminder","Every day at 4pm"],["Sound effects","On"],["Show pronunciation","On"]].map(([l,v],i,a)=>`
          <div style="padding:14px 16px;border-bottom:${i<a.length-1?`1.5px solid var(--paper-alt)`:"none"};display:flex;justify-content:space-between;align-items:center;" class="b-font">
            <span style="font-weight:600;color:var(--ink);">${l}</span>
            <span style="font-size:13px;color:var(--ink-soft);">${v}</span>
          </div>`).join("")}
        </div>
      </div>
      <button id="settings-logout" class="btn btn-tertiary btn-full">Log out</button>
      <div style="text-align:center;font-size:11px;color:var(--ink-soft);margin-top:auto;" class="m-font">
        Poppins v1 · made with ${SVG.heart(12,"#B583E8")}
      </div>
    </div>`;
},

};

// ── ANIMATION NAME HELPER ─────────────────────────────────────────
function animName(a){
  return {kiss:"greta-kiss 1100ms cubic-bezier(.4,1.4,.6,1)",tada:"greta-tada 950ms ease-in-out",bigbounce:"greta-bigbounce 1100ms ease-out",cartwheel:"greta-cartwheel 1000ms cubic-bezier(.5,.9,.5,1)",shake:"greta-oops 620ms ease-in-out",sink:"greta-sink 900ms ease-in-out",headtilt:"greta-headtilt 950ms ease-in-out",spin:"greta-spin-shrink 850ms cubic-bezier(.5,1.4,.5,1)"}[a]||"none";
}

// ── FEEDBACK BURST HTML ───────────────────────────────────────────
function feedbackBurst(feedback,anim){
  if(!feedback||!anim)return"";
  const colors=["#B583E8","#F2EE5B","#8AD7FF","#A8F08C","#FFB0C8"];
  if(anim==="kiss")return`<div style="position:absolute;inset:0;pointer-events:none;z-index:4;"><div style="position:absolute;bottom:78px;left:50%;margin-left:-14px;animation:greta-heart-burst 1100ms ease-out 250ms both;">${SVG.heart(32,"#B583E8")}</div></div>`;
  if(anim==="tada"){
    const dirs=[{dx:-55,dy:-40},{dx:55,dy:-40},{dx:-70,dy:0},{dx:70,dy:0},{dx:0,dy:-65}];
    return`<div style="position:absolute;inset:0;pointer-events:none;z-index:4;">${dirs.map((d,i)=>`<div style="position:absolute;left:50%;top:50%;--dx:${d.dx}px;--dy:${d.dy}px;animation:greta-sparkle-arc 900ms ease-out ${i*50}ms both;">${SVG.spark(22,colors[i])}</div>`).join("")}</div>`;
  }
  if(anim==="bigbounce"){
    const pieces=Array.from({length:18}).map((_,i)=>({cdx:(i*47)%320+"px",cdx2:(((i*13)%60)-30)+"px",delay:(i*35)%400,rot:(i*47)%360,color:colors[i%colors.length]}));
    return`<div style="position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden;">${pieces.map(p=>`<div style="position:absolute;top:0;left:0;--cdx:${p.cdx};--cdx2:${p.cdx2};animation:greta-confetti-rain 1200ms ease-in ${p.delay}ms both;">${SVG.confetti(9,p.color,p.rot)}</div>`).join("")}</div>`;
  }
  if(anim==="cartwheel"){
    const dirs=[{dx:-10,dy:-10,rot:0},{dx:-30,dy:-30,rot:40},{dx:-50,dy:-50,rot:80},{dx:-70,dy:-55,rot:120},{dx:-85,dy:-45,rot:160}];
    return`<div style="position:absolute;inset:0;pointer-events:none;z-index:4;">${dirs.map((d,i)=>`<div style="position:absolute;bottom:24px;right:24px;--dx:${d.dx}px;--dy:${d.dy}px;--rot:${d.rot}deg;animation:greta-petal-trail 1000ms ease-out ${i*80}ms both;">${SVG.bloom(20,colors[i%colors.length],"#F4F1E8",false)}</div>`).join("")}</div>`;
  }
  if(anim==="sink")return`<div style="position:absolute;inset:0;pointer-events:none;z-index:4;"><div style="position:absolute;bottom:38px;right:62px;animation:greta-droplet-fall 1000ms ease-in 200ms both;"><svg width="14" height="20" viewBox="0 0 14 20"><path d="M7 1 C 11 9 13 13 13 16 a6 6 0 0 1 -12 0 C 1 13 3 9 7 1 Z" fill="#8AD7FF"/><ellipse cx="9" cy="13" rx="1.5" ry="3" fill="#fff" opacity=".6"/></svg></div></div>`;
  if(anim==="headtilt")return`<div style="position:absolute;inset:0;pointer-events:none;z-index:4;"><div style="position:absolute;bottom:80px;right:26px;animation:greta-qmark-pop 1000ms ease-out 100ms both;font-family:var(--h-font);font-size:36px;color:var(--wrong);font-weight:700;">?</div></div>`;
  if(anim==="spin")return`<div style="position:absolute;inset:0;pointer-events:none;z-index:2;"><div style="position:absolute;bottom:-8px;right:-8px;width:110px;height:110px;border-radius:50%;background:var(--ink-soft);animation:greta-puff 850ms ease-out both;opacity:.5;"></div></div>`;
  return"";
}

// ── EVENT BINDING ─────────────────────────────────────────────────
function bindEvents(){
  on("login-email","input",e=>setState({loginEmail:e.target.value}));
  on("login-submit","click",sendMagicLink);
  on("login-skip","click",()=>navigate("home",{loginEmail:"",loginSent:false,loginErr:""}));

  on("home-start","click",()=>{if(activeList())navigate("quiz",{quizIdx:0,quizRight:0,quizWrong:0,quizAnswer:"",quizFeedback:null,quizAnim:null,quizWriteMode:false,quizReps:["","","","",""]});});
  on("home-lists","click",()=>navigate("lists"));
  on("home-new","click",()=>navigate("paste",{pasteName:"",pasteText:"",pasteParsed:[],pasteStep:"paste"}));
  on("home-pair","click",()=>navigate("langpicker"));
  on("home-settings","click",()=>navigate("settings"));

  on("lists-close","click",()=>navigate("home"));
  on("lists-add","click",()=>navigate("paste",{pasteName:"",pasteText:"",pasteParsed:[],pasteStep:"paste"}));
  document.querySelectorAll("[data-list-id]").forEach(el=>{
    el.addEventListener("click",e=>{
      if(e.target.closest(".list-delete"))return;
      setState({activeListId:el.dataset.listId,screen:"home"});
    });
  });
  document.querySelectorAll(".list-delete").forEach(el=>{
    el.addEventListener("click",e=>{
      e.stopPropagation();
      const list=state.lists.find(l=>l.id===el.dataset.deleteId);
      if(list)deleteList(list);
    });
  });

  on("paste-close","click",()=>navigate(state.activeListId?"home":"lists"));
  on("paste-cancel","click",()=>navigate(state.activeListId?"home":"lists"));
  on("paste-name","input",e=>setState({pasteName:e.target.value}));
  on("paste-text","input",e=>setState({pasteText:e.target.value}));
  on("paste-parse","click",()=>{
    const parsed=parsePasteText(state.pasteText,state.pair);
    setState({pasteParsed:parsed,pasteStep:"review"});
  });
  on("paste-back","click",()=>setState({pasteStep:"paste"}));
  on("paste-save","click",()=>{
    saveList({id:"user-"+Date.now(),name:state.pasteName||"My new list",color:["rose","butter","sky","mint"][Math.floor(Math.random()*4)],words:state.pasteParsed,from:state.pair.from,to:state.pair.to});
  });

  on("lang-close","click",()=>navigate("home"));
  document.querySelectorAll(".lang-pair-row").forEach(el=>{
    el.addEventListener("click",()=>{
      const from=el.dataset.from,to=el.dataset.to;
      const firstList=state.lists.find(l=>l.from===from&&l.to===to);
      setState({pair:{from,to},activeListId:firstList?firstList.id:null,screen:"home"});
    });
  });

  on("quiz-exit","click",()=>navigate("home"));
  const qi=document.getElementById("quiz-input");
  if(qi){qi.focus();qi.addEventListener("keydown",e=>{if(e.key==="Enter")quizSubmit();});qi.addEventListener("input",e=>setState({quizAnswer:e.target.value}));}
  on("w5-done","click",quizAdvance);
  document.querySelectorAll("[data-w5]").forEach(el=>{
    el.addEventListener("input",e=>write5Check(parseInt(el.dataset.w5),e.target.value));
  });

  on("done-home",  "click",()=>navigate("home"));
  on("done-again", "click",()=>navigate("quiz",{quizIdx:0,quizRight:0,quizWrong:0,quizAnswer:"",quizFeedback:null,quizAnim:null,quizWriteMode:false,quizReps:["","","","",""]}));

  on("settings-close", "click",()=>navigate("home"));
  on("settings-logout","click",signOut);
  on("settings-lang",  "click",()=>navigate("langpicker"));
}

function on(id,evt,fn){const el=document.getElementById(id);if(el)el.addEventListener(evt,fn);}

// ── BOOT ──────────────────────────────────────────────────────────
(async()=>{
  try{await initAuth();}catch{}
  try{if(sessionToken)await loadUserLists();}catch{}
  render();
})();
</script>
</body>
</html>
