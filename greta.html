    20% {transform:translate(-30px,-30px) scale(1.1) rotate(-8deg);}

// ─── BASE COMPONENTS ──────────────────────────────────────────────
function Btn({ children, onClick, variant="primary", size="md", full, type, disabled, style={} }) {
  const sz = { sm:{padding:"8px 14px",fontSize:14}, md:{padding:"12px 20px",fontSize:16}, lg:{padding:"16px 24px",fontSize:18} }[size];
  const v  = {
    primary:  { bg:T.pink,    color:"#fff", shadow:`0 ${size==="lg"?6:4}px 0 ${T.ink}` },
    secondary:{ bg:T.butter,  color:T.ink,  shadow:`0 ${size==="lg"?6:4}px 0 ${T.ink}` },
    tertiary: { bg:T.paper,   color:T.ink,  shadow:`0 ${size==="lg"?6:4}px 0 ${T.ink}` },
    danger:   { bg:T.wrong,   color:"#fff", shadow:`0 ${size==="lg"?6:4}px 0 ${T.ink}` },
  }[variant] || { bg:T.pink, color:"#fff", shadow:`0 4px 0 ${T.ink}` };
  const [pressed, setPressed] = useState(false);
  const pressY = size==="lg" ? 4 : 3;
  return (
    <button type={type||"button"} disabled={disabled} onClick={onClick}
      onMouseDown={()=>setPressed(true)} onMouseUp={()=>setPressed(false)}
      onMouseLeave={()=>setPressed(false)} onTouchStart={()=>setPressed(true)} onTouchEnd={()=>setPressed(false)}
      style={{
        ...sz, background:v.bg, color:v.color,
        border:T.border, borderRadius:T.radius, fontFamily:T.bFont, fontWeight:700,
        letterSpacing:"-0.01em", cursor:disabled?"not-allowed":"pointer", opacity:disabled?0.5:1,
        boxShadow: pressed ? `0 1px 0 ${T.ink}` : v.shadow,
        transform:pressed?`translateY(${pressY}px)`:"translateY(0)",
        transition:"transform 80ms, box-shadow 80ms",
        display:"inline-flex", alignItems:"center", justifyContent:"center", gap:8,
        width:full?"100%":"auto", outline:"none",
        ...style,
      }}>
      {children}
    </button>
  );
}

function Card({ children, style={}, color, large, onClick }) {
  return (
    <div onClick={onClick} style={{
      background:color||T.paper, border:T.border,
      borderRadius:large?T.radiusLg:T.radius,
      boxShadow:large?T.shadowLg:T.shadow,
      padding:20, cursor:onClick?"pointer":"default", ...style,
    }}>
      {children}
    </div>
  );
}

function DotBar({ total, current }) {
  return (
    <div style={{ display:"flex", gap:6, alignItems:"center", flexWrap:"wrap" }}>

          background:i<current?T.mint:i===current?T.butter:T.paperAlt,
          transition:"all 200ms",

  );
}

// ─── AUTH ─────────────────────────────────────────────────────────
function parseJWT(token) {
  try { return JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))); }
  catch { return null; }
}
function tokenExpired(token) {
  const p = parseJWT(token);
  return !p?.exp || Date.now()/1000 > p.exp - 60;
}

// ─── FEEDBACK BURST ───────────────────────────────────────────────
function FeedbackBurst({ feedback, anim, keyboardUp }) {
  if (!feedback || !anim) return null;
  if (anim === "kiss") return (
    <div style={{ position:"absolute", inset:0, pointerEvents:"none", zIndex:4 }}>
      <div style={{ position:"absolute", bottom:keyboardUp?64:78, left:"50%", marginLeft:-14,
        animation:"greta-heart-burst 1100ms ease-out 250ms both" }}>
        <Heart size={32} color={T.pink}/>
      </div>
    </div>
  );
  if (anim === "tada") {
    const colors=[T.pink,T.butter,T.sky,T.mint,T.rose];
    const dirs=[{dx:-55,dy:-40},{dx:55,dy:-40},{dx:-70,dy:0},{dx:70,dy:0},{dx:0,dy:-65}];
    return (
      <div style={{ position:"absolute", inset:0, pointerEvents:"none", zIndex:4 }}>
        {dirs.map((d,i)=>(
          <div key={i} style={{ position:"absolute", left:"50%", top:"50%",
            "--dx":d.dx+"px", "--dy":d.dy+"px",
            animation:`greta-sparkle-arc 900ms ease-out ${i*50}ms both` }}>
            <Spark size={keyboardUp?18:22} color={colors[i%colors.length]}/>
          </div>
        ))}
      </div>
    );
  }
  if (anim === "bigbounce") {
    const colors=[T.pink,T.butter,T.sky,T.mint,T.rose];
    const pieces=Array.from({length:18}).map((_,i)=>({
      cdx:(i*47)%320+"px", cdx2:(((i*13)%60)-30)+"px",
      delay:(i*35)%400, rot:(i*47)%360, color:colors[i%colors.length],
    }));
    return (
      <div style={{ position:"absolute", inset:0, pointerEvents:"none", zIndex:4, overflow:"hidden" }}>
        {pieces.map((p,i)=>(
          <div key={i} style={{ position:"absolute", top:0, left:0,
            "--cdx":p.cdx, "--cdx2":p.cdx2,
            animation:`greta-confetti-rain 1200ms ease-in ${p.delay}ms both` }}>
            <ConfettiPiece size={9} color={p.color} rot={p.rot}/>
          </div>
        ))}
      </div>
    );
  }
  if (anim === "cartwheel") {
    const colors=[T.pink,T.butter,T.mint];
    const dirs=[{dx:-10,dy:-10,rot:0},{dx:-30,dy:-30,rot:40},{dx:-50,dy:-50,rot:80},{dx:-70,dy:-55,rot:120},{dx:-85,dy:-45,rot:160}];
    return (
      <div style={{ position:"absolute", inset:0, pointerEvents:"none", zIndex:4 }}>
        {dirs.map((d,i)=>(
          <div key={i} style={{ position:"absolute", bottom:keyboardUp?16:24, right:keyboardUp?16:24,
            "--dx":d.dx+"px", "--dy":d.dy+"px", "--rot":d.rot+"deg",
            animation:`greta-petal-trail 1000ms ease-out ${i*80}ms both` }}>
            <Bloom size={keyboardUp?16:20} color={colors[i%colors.length]} center={T.paper}/>
          </div>
        ))}
      </div>
    );
  }
  if (anim === "sink") return (
    <div style={{ position:"absolute", inset:0, pointerEvents:"none", zIndex:4 }}>
      <div style={{ position:"absolute", bottom:keyboardUp?30:38, right:keyboardUp?50:62,
        animation:"greta-droplet-fall 1000ms ease-in 200ms both" }}>
        <svg width="14" height="20" viewBox="0 0 14 20" aria-hidden="true">
          <path d="M7 1 C 11 9 13 13 13 16 a6 6 0 0 1 -12 0 C 1 13 3 9 7 1 Z" fill={T.sky}/>
          <ellipse cx="9" cy="13" rx="1.5" ry="3" fill="#fff" opacity="0.6"/>
        </svg>
      </div>
    </div>
  );
  if (anim === "headtilt") return (
    <div style={{ position:"absolute", inset:0, pointerEvents:"none", zIndex:4 }}>
      <div style={{ position:"absolute", bottom:keyboardUp?58:80, right:keyboardUp?18:26,
        animation:"greta-qmark-pop 1000ms ease-out 100ms both",
        fontFamily:T.hFont, fontSize:keyboardUp?28:36, color:T.wrong, fontWeight:700 }}>?</div>
    </div>
  );
  if (anim === "spin") return (
    <div style={{ position:"absolute", inset:0, pointerEvents:"none", zIndex:2 }}>
      <div style={{ position:"absolute", bottom:keyboardUp?-4:-8, right:keyboardUp?-4:-8,
        width:keyboardUp?80:110, height:keyboardUp?80:110, borderRadius:"50%",
        background:T.inkSoft, animation:"greta-puff 850ms ease-out both", opacity:0.5 }}/>
    </div>
  );
  return null;
}

const ANIM_MAP = {
  kiss:      "greta-kiss 1100ms cubic-bezier(.4,1.4,.6,1) both",
  tada:      "greta-tada 950ms ease-in-out both",
  bigbounce: "greta-bigbounce 1100ms ease-out both",
  cartwheel: "greta-cartwheel 1000ms cubic-bezier(.5,.9,.5,1) both",
  shake:     "greta-oops 620ms ease-in-out both",
  sink:      "greta-sink 900ms ease-in-out both",
  headtilt:  "greta-headtilt 950ms ease-in-out both",
  spin:      "greta-spin-shrink 850ms cubic-bezier(.5,1.4,.5,1) both",
};

// ─── SCREEN: LOGIN ────────────────────────────────────────────────
function ScreenLogin({ onLogin, currentUser, onSendLink }) {
  const [email, setEmail] = useState("");
  const [sent, setSent] = useState(false);
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");

  const send = async (e) => {
    e?.preventDefault();
    if (!email.includes("@")) { setErr("Enter a valid email"); return; }
    setErr(""); setLoading(true);
    try {
      const res = await fetch(`${SUPABASE_URL}/auth/v1/otp`, {
        method:"POST",
        headers:{"Content-Type":"application/json","apikey":SUPABASE_ANON_KEY},
        body:JSON.stringify({ email, create_user:true, options:{ emailRedirectTo: location.href.split("#")[0] } }),
      });
      if (!res.ok) { const d=await res.json(); throw new Error(d.msg||d.error_description||"Could not send link"); }
      setSent(true);
    } catch(e) { setErr(e.message||"Could not send link"); }
    finally { setLoading(false); }
  };

  return (
    <div style={{ padding:"24px 24px", display:"flex", flexDirection:"column", alignItems:"center", textAlign:"center", gap:20, minHeight:"100%", justifyContent:"center" }}>
      {!sent ? (<>
        <Mascot size={140} mood="happy"/>
        <div>
          <h1 style={{ fontFamily:T.hFont, fontSize:44, margin:0, color:T.ink, letterSpacing:"-0.02em", lineHeight:1 }}>Hej!</h1>
          <p style={{ fontFamily:T.bFont, color:T.inkSoft, fontSize:16, marginTop:8, marginBottom:0, maxWidth:260 }}>
            I'm Poppins. Drop your email and I'll send a magic link — no passwords, promise.
          </p>
        </div>
        <form onSubmit={send} style={{ width:"100%", display:"flex", flexDirection:"column", gap:12 }}>
          <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@email.com"
            style={{ width:"100%", padding:"14px 18px", border:T.border, borderRadius:T.radius,
              fontFamily:T.bFont, fontSize:16, background:T.paper, color:T.ink,
              outline:"none", boxSizing:"border-box", boxShadow:`inset 0 2px 0 ${T.paperAlt}` }}/>
          {err && <div style={{ fontFamily:T.bFont, color:T.wrong, fontSize:14 }}>{err}</div>}
          <Btn variant="primary" size="lg" full type="submit" disabled={loading}>
            <Spark size={18} color="#fff"/> {loading ? "Sending…" : "Send magic link"}
          </Btn>
          <button type="button" onClick={onLogin}
            style={{ background:"none", border:"none", color:T.inkSoft, fontFamily:T.bFont, fontSize:14, cursor:"pointer", marginTop:4, textDecoration:"underline" }}>
            skip — try Poppins first
          </button>
        </form>
      </>) : (<>
        <Mascot size={140} mood="cheer"/>
        <div>
          <h1 style={{ fontFamily:T.hFont, fontSize:36, margin:0, color:T.ink, letterSpacing:"-0.02em", lineHeight:1.05 }}>Check your inbox</h1>
          <p style={{ fontFamily:T.bFont, color:T.inkSoft, fontSize:15, marginTop:12, marginBottom:0, maxWidth:280 }}>
            I sent a sparkly link to <strong style={{ color:T.ink }}>{email}</strong>. Tap it to come on in.
          </p>
        </div>
        <Btn variant="secondary" size="md" onClick={onLogin}>
          I clicked it — let me in <ArrowRight size={16} color={T.ink}/>
        </Btn>
      </>)}
    </div>
  );
}

// ─── SCREEN: PASTE ────────────────────────────────────────────────
function ScreenPaste({ pair, onSave, onCancel }) {
  const [name, setName]   = useState("");
  const [text, setText]   = useState("");
  const [parsed, setParsed] = useState([]);
  const [step, setStep]   = useState("paste");
  const [saving, setSaving] = useState(false);

  const parse = () => {
    const lines = text.split("\n").map(l=>l.trim()).filter(Boolean);
    const out = [];
    for (const line of lines) {
      const m = line.match(/^(.+?)\s*[=\-–→:\t]+\s*(.+)$/);
      if (m) { out.push({ [pair.from]:m[1].trim(), [pair.to]:m[2].trim() }); }
      else if (line.split(/\s{2,}/).length===2) {
        const [a,b]=line.split(/\s{2,}/);
        out.push({ [pair.from]:a.trim(), [pair.to]:b.trim() });
      }
    }
    setParsed(out);
    setStep("review");
  };

  const save = () => {
    setSaving(true);
    onSave({
      id: "user-"+Date.now(),
      name: name||"My new list",
      color: ["rose","butter","sky","mint"][Math.floor(Math.random()*4)],
      words: parsed,
      from: pair.from, to: pair.to,
    });
  };

  return (
    <div style={{ padding:"24px 20px", display:"flex", flexDirection:"column", gap:16, minHeight:"100%" }}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
        <h2 style={{ fontFamily:T.hFont, fontSize:28, margin:0, color:T.ink, letterSpacing:"-0.02em", lineHeight:1.1 }}>
          {step==="paste"?"Paste a word list":"Look right?"}
        </h2>
        <button onClick={onCancel} style={{ background:T.paperAlt, border:T.borderThin, borderRadius:999, width:36,height:36,
          cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", outline:"none" }}>
          <Cross size={16} color={T.ink} weight={3}/>
        </button>
      </div>

      {step==="paste" && (<>
        <div style={{ display:"inline-flex", alignItems:"center", gap:6, alignSelf:"flex-start",
          padding:"4px 10px", borderRadius:999, background:T.butterSoft, border:T.borderThin,
          fontFamily:T.mFont, fontSize:11, fontWeight:700, color:T.ink }}>
          <span>{LANGUAGES[pair.from]?.code||"SV"}</span>
          <ArrowRight size={10} color={T.ink} weight={3}/>
          <span>{LANGUAGES[pair.to]?.code||"EN"}</span>
        </div>
        <p style={{ fontFamily:T.bFont, color:T.inkSoft, fontSize:14, margin:0, lineHeight:1.6 }}>
          Copy from anywhere — Notes, a PDF, a screenshot. Use any separator:{" "}
          {["=","-",":","→"].map(s=>(
            <code key={s} style={{ fontFamily:T.mFont, background:T.paperAlt, padding:"1px 6px", borderRadius:6, marginRight:4 }}>{s}</code>
          ))}
        </p>
        <input value={name} onChange={e=>setName(e.target.value)} placeholder="What's this list called?"
          style={{ padding:"12px 16px", border:T.border, borderRadius:T.radius,
            fontFamily:T.hFont, fontSize:18, background:T.paper, color:T.ink, outline:"none" }}/>
        <textarea value={text} onChange={e=>setText(e.target.value)}
          placeholder={"katt = cat\nhund - dog\nhäst → horse\nfågel: bird"} rows={9}
          style={{ padding:"14px 16px", border:T.border, borderRadius:T.radius,
            fontFamily:T.mFont, fontSize:14, background:T.paper, color:T.ink, outline:"none",
            resize:"none", boxShadow:`inset 0 2px 0 ${T.paperAlt}`, lineHeight:1.6 }}/>
        <div style={{ display:"flex", gap:10 }}>
          <Btn variant="tertiary" size="md" onClick={onCancel}>Cancel</Btn>
          <Btn variant="primary" size="md" onClick={parse} disabled={!text.trim()} style={{ flex:1 }}>
            <Spark size={16} color="#fff"/> Sort it out
          </Btn>
        </div>
      </>)}

      {step==="review" && (<>
        <div style={{ background:T.mintSoft, border:T.borderThin, borderRadius:T.radius,
          padding:"10px 14px", display:"flex", alignItems:"center", gap:8 }}>
          <Check size={18} color={T.ink} weight={4}/>
          <span style={{ fontFamily:T.bFont, fontSize:14, color:T.ink, fontWeight:600 }}>
            Found <strong>{parsed.length}</strong> words
          </span>
        </div>
        <div style={{ flex:1, overflowY:"auto", display:"flex", flexDirection:"column", gap:6 }}>
          {parsed.map((w,i)=>(
            <div key={i} style={{ display:"flex", alignItems:"center", gap:12,
              background:T.paper, border:T.borderThin, borderRadius:14, padding:"10px 14px", fontFamily:T.bFont, fontSize:15 }}>
              <span style={{ color:T.ink, fontWeight:700, flex:1 }}>{w[pair.from]||w.sv}</span>
              <ArrowRight size={14} color={T.inkSoft} weight={2.5}/>
              <span style={{ color:T.inkSoft, flex:1 }}>{w[pair.to]||w.en}</span>
            </div>
          ))}
        </div>
        <div style={{ display:"flex", gap:10 }}>
          <Btn variant="tertiary" size="md" onClick={()=>setStep("paste")}>Edit</Btn>
          <Btn variant="primary" size="md" onClick={save} disabled={parsed.length===0||saving} style={{ flex:1 }}>
            {saving?"Saving…":"Save list"} <ArrowRight size={16} color="#fff"/>
          </Btn>
        </div>
      </>)}
    </div>
  );
}

// ─── SCREEN: LANGUAGE PICKER ──────────────────────────────────────
function ScreenLangPicker({ pair, lists, onPick, onClose }) {
  const seen=new Set(); const pairs=[];
  lists.forEach(l=>{
    if(!l.from||!l.to) return;
    const k=l.from+">"+l.to;
    if(seen.has(k)) return;
    seen.add(k);
    pairs.push({ from:l.from, to:l.to, count:lists.filter(x=>x.from===l.from&&x.to===l.to).length });
  });
  const Chip=({code,color})=>(
    <span style={{ width:32,height:32,borderRadius:999,border:T.border,background:color||"#ccc",
      display:"inline-flex",alignItems:"center",justifyContent:"center",
      fontFamily:T.mFont,fontSize:11,fontWeight:800,color:T.ink,boxShadow:`0 2px 0 ${T.ink}` }}>{code}</span>
  );
  return (
    <div style={{ padding:"24px 20px", display:"flex", flexDirection:"column", gap:16, minHeight:"100%" }}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
        <h2 style={{ fontFamily:T.hFont, fontSize:30, margin:0, color:T.ink, letterSpacing:"-0.02em" }}>Which language?</h2>
        <button onClick={onClose} style={{ background:T.paperAlt, border:T.borderThin, borderRadius:999, width:36,height:36,
          cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", outline:"none" }}>
          <Cross size={16} color={T.ink} weight={3}/>
        </button>
      </div>
      <p style={{ fontFamily:T.bFont, color:T.inkSoft, fontSize:14, margin:0 }}>Pick a language you're learning from another.</p>
      <div style={{ display:"flex", flexDirection:"column", gap:10, flex:1 }}>
        {pairs.length===0 && (
          <div style={{ fontFamily:T.bFont, color:T.inkSoft, textAlign:"center", padding:"32px 0" }}>
            Add some lists first!
          </div>
        )}
        {pairs.map(p=>{

}

// ─── SCREEN: QUIZ ─────────────────────────────────────────────────
function ScreenQuiz({ list, onDone, onExit }) {
  const [idx, setIdx]         = useState(0);
  const [answer, setAnswer]   = useState("");
  const [feedback, setFeedback] = useState(null);
  const [right, setRight]     = useState(0);
  const [wrong, setWrong]     = useState(0);
  const [writeMode, setWriteMode] = useState(false);
  const [anim, setAnim]       = useState(null);
  const inputRef = useRef(null);

  const lh    = langHelpers(list);
  const word  = list.words[idx];
  const total = list.words.length;

  // Keep refs so the auto-advance timeout always sees fresh values
  const idxRef   = useRef(idx);
  const rightRef = useRef(right);
  const wrongRef = useRef(wrong);
  useEffect(()=>{ idxRef.current   = idx;   }, [idx]);
  useEffect(()=>{ rightRef.current = right; }, [right]);
  useEffect(()=>{ wrongRef.current = wrong; }, [wrong]);

  useEffect(()=>{ if(inputRef.current && !feedback) inputRef.current.focus(); }, [idx, feedback]);

  const advance = () => {
    const nextIdx = idxRef.current + 1;
    if(nextIdx >= total) { onDone({ right:rightRef.current, wrong:wrongRef.current, total }); return; }
    setIdx(nextIdx); setAnswer(""); setFeedback(null); setAnim(null); setWriteMode(false);
  };

  const submit = () => {
    if(!answer.trim()||feedback) return;
    const guess   = answer.trim().toLowerCase();
    const correct = lh.tgt(word).toLowerCase();
    const ok      = guess===correct;
    const pool    = ok ? ["kiss","tada","bigbounce","cartwheel"] : ["shake","sink","headtilt","spin"];
    setAnim(pool[Math.floor(Math.random()*pool.length)]);
    if(ok) { setRight(r=>r+1); setFeedback("correct"); }
    else   { setWrong(w=>w+1); setFeedback("wrong"); }
  };

  const advanceRef = useRef(advance);
  useEffect(()=>{ advanceRef.current = advance; });

  useEffect(()=>{
    if(!feedback) return;
    const delay = feedback==="correct" ? 1200 : 1400;
    const id = setTimeout(()=>{
      if(feedback==="correct") advanceRef.current();
      else setWriteMode(true);
    }, delay);
    return ()=>clearTimeout(id);
  }, [feedback]);

  if(writeMode) return <ScreenWriteFive list={list} word={word} onDone={advance}/>;

  const fbCard   = feedback==="correct"?T.mintSoft:feedback==="wrong"?T.pinkSoft:T.paper;
  const cardAnim = feedback==="correct"?"greta-card-correct 700ms ease-out":feedback==="wrong"?"greta-card-wrong 480ms ease-in-out":"none";
  const mascotMood = feedback==="correct"?(anim==="tada"?"proud":"cheer"):feedback==="wrong"?"oops":"happy";

  return (
    <div style={{ padding:"20px 20px 24px", display:"flex", flexDirection:"column", gap:14, minHeight:"100%", boxSizing:"border-box" }}>
      {/* HUD */}
      <div style={{ display:"flex", alignItems:"center", gap:10 }}>
        <button onClick={onExit} style={{ background:T.paperAlt, border:T.borderThin, borderRadius:999,
          width:34,height:34, cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center",
          flexShrink:0, outline:"none" }}>
          <ArrowBack size={14} color={T.ink} weight={3}/>
        </button>
        <div style={{ flex:1, display:"flex", flexDirection:"column", gap:4 }}>
          <DotBar total={total} current={idx}/>
          <div style={{ display:"flex", justifyContent:"space-between", fontFamily:T.mFont, fontSize:11, color:T.inkSoft }}>
            <span>{idx+1} / {total}</span>
            <span style={{ display:"flex", gap:10 }}>
              <span style={{ color:T.correct, fontWeight:700 }}>✓{right}</span>
              <span style={{ color:T.wrong, fontWeight:700 }}>✗{wrong}</span>
            </span>
          </div>
        </div>
      </div>

      {/* Question card */}
      <Card large color={fbCard} style={{
        flex:1, display:"flex", flexDirection:"column", justifyContent:"center",
        padding:24, transition:"background 250ms", position:"relative", overflow:"hidden",
        animation:cardAnim,
      }}>
        <div style={{ display:"flex", flexDirection:"column", gap:14, alignItems:"center", textAlign:"center" }}>
          <div style={{ fontFamily:T.bFont, fontSize:11, fontWeight:700, letterSpacing:"0.16em",
            textTransform:"uppercase", color:T.ink, opacity:0.5 }}>{lh.srcLang}</div>
          <div style={{ fontFamily:T.hFont, fontSize:54, lineHeight:0.95, color:T.ink,
            letterSpacing:"-0.03em", wordBreak:"break-word", maxWidth:"100%" }}>{lh.src(word)}</div>
          {feedback==="wrong" && (
            <div style={{ fontFamily:T.hFont, fontSize:30, color:T.wrong, lineHeight:1,
              letterSpacing:"-0.02em", animation:"greta-answer-rise 360ms ease-out both" }}>
              = {lh.tgt(word)}
            </div>
          )}
          {!feedback && (<>
            <div style={{ height:1, width:40, background:T.ink, opacity:0.2 }}/>
            <div style={{ fontFamily:T.bFont, fontSize:14, color:T.ink, opacity:0.7 }}>
              What does this mean in {lh.tgtLang}?
            </div>
          </>)}
        </div>

        {feedback && <FeedbackBurst feedback={feedback} anim={anim}/>}

        <div style={{
          position:"absolute", bottom:-8, right:-8,
          transformOrigin:"center bottom",
          animation:ANIM_MAP[anim]||"none",
          zIndex:3,
          ...(anim==="kiss" ? { bottom:14, right:"50%", marginRight:-36 } : {}),
        }}>
          <Mascot size={86} mood={mascotMood}/>
        </div>
      </Card>

      {/* Input */}
      <input ref={inputRef} value={answer} onChange={e=>setAnswer(e.target.value)}
        onKeyDown={e=>{ if(e.key==="Enter") submit(); }}
        disabled={!!feedback}
        placeholder={`type in ${lh.tgtLang}, then press enter…`}
        style={{ padding:"16px 18px", border:T.border, borderRadius:T.radius,
          fontFamily:T.bFont, fontSize:18, fontWeight:600,
          background:feedback==="correct"?T.mintSoft:feedback==="wrong"?T.pinkSoft:T.paper,
          color:T.ink, outline:"none", boxShadow:`inset 0 2px 0 ${T.paperAlt}`,
          transition:"background 250ms", textAlign:feedback?"center":"left" }}/>
    </div>
  );
}

// ─── SCREEN: WRITE 5× ────────────────────────────────────────────
function ScreenWriteFive({ list, word, onDone }) {
  const lh = langHelpers(list);
  const [reps, setReps] = useState(["","","","",""]);
  const inputRefs = useRef([]);

  useEffect(()=>{ inputRefs.current[0]?.focus(); }, []);

  const setRep = (i, v) => {
    const next=[...reps]; next[i]=v; setReps(next);
    if(v.trim().toLowerCase()===lh.tgt(word).toLowerCase() && i<4) {
      setTimeout(()=>inputRefs.current[i+1]?.focus(), 100);
    }
  };

  const completed = reps.filter(r=>r.trim().toLowerCase()===lh.tgt(word).toLowerCase()).length;
  const allDone   = completed===5;

  return (
    <div style={{ padding:"20px 20px 24px", display:"flex", flexDirection:"column", gap:16, minHeight:"100%", boxSizing:"border-box" }}>
      <div style={{ textAlign:"center" }}>
        <div style={{ fontFamily:T.bFont, fontSize:11, fontWeight:700, letterSpacing:"0.16em", textTransform:"uppercase", color:T.inkSoft }}>Practice</div>
        <h2 style={{ fontFamily:T.hFont, fontSize:28, margin:"4px 0 0", color:T.ink, letterSpacing:"-0.02em", lineHeight:1.05 }}>
          Write "<span style={{ color:T.pink }}>{lh.tgt(word)}</span>" 5 times
        </h2>
        <p style={{ fontFamily:T.bFont, color:T.inkSoft, fontSize:13, margin:"6px 0 0" }}>
          ({lh.src(word)} in {lh.srcLang})
        </p>
      </div>

      <div style={{ display:"flex", justifyContent:"center" }}>
        <Mascot size={80} mood="thinking"/>
      </div>

      <div style={{ display:"flex", flexDirection:"column", gap:8, flex:1 }}>
        {reps.map((r,i)=>{
          const ok=r.trim().toLowerCase()===lh.tgt(word).toLowerCase();
          return (
            <div key={i} style={{ display:"flex", alignItems:"center", gap:10 }}>
              <div style={{ width:30,height:30,borderRadius:999,border:T.borderThin,
                background:ok?T.correct:T.paperAlt,display:"flex",alignItems:"center",justifyContent:"center",
                fontFamily:T.mFont,fontSize:13,fontWeight:700,color:ok?"#fff":T.ink,flexShrink:0 }}>
                {ok?<Check size={14} color="#fff" weight={4}/>:i+1}
              </div>
              <input ref={el=>inputRefs.current[i]=el} value={r} onChange={e=>setRep(i,e.target.value)}
                disabled={ok} placeholder={i===0?lh.tgt(word):""}
                style={{ flex:1, padding:"12px 14px", border:T.border, borderRadius:T.radius,
                  fontFamily:T.bFont, fontSize:16, fontWeight:600,
                  background:ok?T.mintSoft:T.paper, color:T.ink, outline:"none", opacity:ok?0.7:1 }}/>
            </div>
          );
        })}
      </div>

      <Btn variant="primary" size="lg" full onClick={onDone} disabled={!allDone}>
        {allDone ? <>Got it — keep going <ArrowRight size={18} color="#fff"/></> : `${completed} / 5 done`}
      </Btn>
    </div>
  );
}

// ─── SCREEN: CELEBRATION ──────────────────────────────────────────
function ScreenDone({ result, onAgain, onHome }) {
  const pct   = Math.round((result.right/result.total)*100);
  const stars = pct>=90?3:pct>=60?2:1;
  const colors=[T.pink,T.butter,T.sky,T.mint,T.rose];
  const pieces=Array.from({length:24}).map((_,i)=>({
    color:colors[i%colors.length], left:(i*37)%100, delay:(i*80)%1500, rot:(i*47)%360,
  }));
  return (
    <div style={{ padding:"32px 22px", display:"flex", flexDirection:"column", alignItems:"center",
      textAlign:"center", gap:18, minHeight:"100%", justifyContent:"center", position:"relative", overflow:"hidden" }}>
      {pieces.map((p,i)=>(
        <div key={i} style={{ position:"absolute", top:-20, left:`${p.left}%`,
          animation:`greta-fall 3s ${p.delay}ms infinite linear` }}>
          <ConfettiPiece size={10} color={p.color} rot={p.rot}/>
        </div>
      ))}
      <Mascot size={150} mood="proud"/>
      <div style={{ display:"flex", gap:6 }}>
        {[1,2,3].map(s=>(
          <div key={s} style={{ width:50,height:50,borderRadius:999,
            background:s<=stars?T.butter:T.paperAlt, border:T.border,
            display:"flex", alignItems:"center", justifyContent:"center",
            transform:s<=stars?"scale(1)":"scale(0.85)", transition:"transform 300ms",
            boxShadow:s<=stars?`0 4px 0 ${T.ink}`:"none" }}>
            <Spark size={26} color={s<=stars?T.ink:T.inkSoft}/>
          </div>
        ))}
      </div>
      <div>
        <h1 style={{ fontFamily:T.hFont, fontSize:44, margin:0, color:T.ink, letterSpacing:"-0.03em", lineHeight:1 }}>You did it!</h1>
        <p style={{ fontFamily:T.bFont, color:T.inkSoft, fontSize:16, marginTop:8, marginBottom:0 }}>
          {pct}% right · <span style={{ fontFamily:T.mFont }}>{result.right}/{result.total}</span> on the first try
        </p>
      </div>
      <div style={{ display:"flex", gap:10, width:"100%", maxWidth:320 }}>
        <Btn variant="tertiary" size="md" onClick={onHome}>Home</Btn>
        <Btn variant="primary" size="md" onClick={onAgain} style={{ flex:1 }}>
          Play again <ArrowRight size={16} color="#fff"/>
        </Btn>
      </div>
    </div>
  );
}

// ─── APP SHELL ────────────────────────────────────────────────────
function App() {
  // Auth state
  const [currentUser,   setCurrentUser]   = useState(null);
  const [sessionToken,  setSessionToken]  = useState(null);
  const [authLoading,   setAuthLoading]   = useState(true);

  // App state
  const [screen,        setScreen]        = useState("home");
  const [lists,         setLists]         = useState(SAMPLE_LISTS);
  const [pair,          setPair]          = useState({ from:"sv", to:"en" });
  const [activeListId,  setActiveListId]  = useState("djur");
  const [result,        setResult]        = useState(null);

  const pairLists = lists.filter(l=>(l.from||"sv")===pair.from&&(l.to||"en")===pair.to);

  // ── Auth helpers ──────────────────────────────────────────────
  function saveSession(token, refresh) {
    localStorage.setItem("greta_session", JSON.stringify({token,refresh}));
  }
  function clearSession() {
    localStorage.removeItem("greta_session");
    setCurrentUser(null); setSessionToken(null);
  }

  function applySession(token, refresh) {
    const p = parseJWT(token);
    const user = p ? { id:p.sub, email:p.email } : null;
    setCurrentUser(user); setSessionToken(token);
    saveSession(token, refresh);
    return user;
  }

  useEffect(()=>{
    (async()=>{
      // Handle magic link redirect
      const params = new URLSearchParams(location.hash.substring(1));
      const hashToken = params.get("access_token");
      const hashRefresh = params.get("refresh_token");
      if(hashToken) {
        applySession(hashToken, hashRefresh);
        history.replaceState(null, "", location.pathname+location.search);
        setAuthLoading(false);
        return;
      }
      // Restore saved session
      try {
        const saved = localStorage.getItem("greta_session");
        if(!saved) { setAuthLoading(false); return; }
        let { token, refresh } = JSON.parse(saved);
        if(tokenExpired(token) && refresh) {
          const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
            method:"POST",
            headers:{"Content-Type":"application/json","apikey":SUPABASE_ANON_KEY},
            body:JSON.stringify({refresh_token:refresh}),
          });
          if(!res.ok) { clearSession(); setAuthLoading(false); return; }
          const d = await res.json();
          token=d.access_token; refresh=d.refresh_token;
        } else if(tokenExpired(token)) { clearSession(); setAuthLoading(false); return; }
        applySession(token, refresh);
      } catch { clearSession(); }
      setAuthLoading(false);
    })();
  }, []);

  // ── Load lists from Supabase ──────────────────────────────────
  useEffect(()=>{
    if(!sessionToken) return;
    loadLists();
  }, [sessionToken]);

  async function loadLists() {
    try {
      const res = await fetch(`${API}/sets`, { headers:{"Authorization":`Bearer ${sessionToken}`} });
      if(!res.ok) return;
      const sets = await res.json();
      const COLORS = ["rose","butter","sky","mint","pink"];
      const mapped = sets.map((s,i)=>({
        id:    s.id,
        name:  s.topic,
        color: COLORS[i % COLORS.length],
        words: (s.vocab||[]).map(p=>({sv:p.sv, en:typeof p.en==="string"&&p.en.includes("|")?p.en.split("|").map(x=>x.trim()):p.en})),
        from:  "sv",
        to:    "en",
      }));
      if(mapped.length>0) {
        setLists(mapped);
        setActiveListId(mapped[0].id);
      }
    } catch {}
  }

  async function saveList(newList) {
    const words = newList.words.map(w=>({ sv:w[newList.from]||w.sv, en:w[newList.to]||w.en }));
    if(!sessionToken) {
      // Guest mode — keep in memory only
      setLists(l=>[...l, newList]);
      setActiveListId(newList.id);
      setScreen("home");
      return;
    }
    try {
      const res = await fetch(`${API}/sets`, {
        method:"POST",
        headers:{"Content-Type":"application/json","Authorization":`Bearer ${sessionToken}`},
        body:JSON.stringify({ topic:newList.name, vocab:words }),
      });
      const saved = await res.json();
      if(!res.ok) throw new Error(saved.error||"Save failed");
      const stamped = { ...newList, id:saved.id };
      setLists(l=>[...l, stamped]);
      setActiveListId(stamped.id);
    } catch {
      setLists(l=>[...l, newList]);
      setActiveListId(newList.id);
    }
    setScreen("home");
  }

  async function deleteList(list) {
    if(sessionToken) {
      try {
        await fetch(`${API}/sets/${list.id}`, { method:"DELETE", headers:{"Authorization":`Bearer ${sessionToken}`} });
      } catch {}
    }
    setLists(l=>l.filter(x=>x.id!==list.id));
    if(activeListId===list.id) setActiveListId(null);
  }

  async function signOut() {
    if(sessionToken) {
      fetch(`${SUPABASE_URL}/auth/v1/logout`, {
        method:"POST",
        headers:{"apikey":SUPABASE_ANON_KEY,"Authorization":`Bearer ${sessionToken}`},
      }).catch(()=>{});
    }
    clearSession();
    setLists(SAMPLE_LISTS);
    setActiveListId("djur");
    setScreen("home");
  }

  function changePair(p) {
    setPair({ from:p.from, to:p.to });
    const first = lists.find(l=>l.from===p.from&&l.to===p.to);
    setActiveListId(first?first.id:null);
    setScreen("home");
  }

  const activeList = lists.find(l=>l.id===activeListId);

  if(authLoading) return (
    <div style={{ display:"flex", alignItems:"center", justifyContent:"center",
      width:360, height:720, background:T.paper, borderRadius:T.radiusLg }}>
      <Bloom size={40} color={T.pink} center={T.butter} spinning/>
    </div>
  );

  // Screen rendering
  let body;
  switch(screen) {
    case "login":
      body = <ScreenLogin onLogin={()=>setScreen("home")} currentUser={currentUser}/>;
      break;
    case "home":
      body = <ScreenHome
        lists={pairLists} activeListId={activeListId} pair={pair}
        onPickList={()=>setScreen("lists")}
        onAddList={()=>setScreen("paste")}
        onStart={()=>activeList&&setScreen("quiz")}
        onSettings={()=>setScreen("settings")}
        onPickPair={()=>setScreen("langpicker")}/>;
      break;
    case "lists":
      body = <ScreenLists
        lists={pairLists} activeListId={activeListId}
        onPick={id=>{ setActiveListId(id); setScreen("home"); }}
        onAdd={()=>setScreen("paste")}
        onClose={()=>setScreen("home")}
        onDelete={deleteList}/>;
      break;
    case "paste":
      body = <ScreenPaste pair={pair} onSave={saveList} onCancel={()=>setScreen(activeListId?"home":"lists")}/>;
      break;
    case "quiz":
      if(!activeList) { setScreen("home"); return null; }
      body = <ScreenQuiz list={activeList} onDone={r=>{ setResult(r); setScreen("done"); }} onExit={()=>setScreen("home")}/>;
      break;
    case "done":
      body = <ScreenDone
        result={result||{right:0,wrong:0,total:0}}
        onAgain={()=>{ setResult(null); setScreen("quiz"); }}
        onHome={()=>{ setResult(null); setScreen("home"); }}/>;
      break;
    case "settings":
      body = <ScreenSettings pair={pair} currentUser={currentUser}
        onClose={()=>setScreen("home")} onLogout={signOut} onChangePair={()=>setScreen("langpicker")}/>;
      break;
    case "langpicker":
      body = <ScreenLangPicker pair={pair} lists={lists} onPick={changePair} onClose={()=>setScreen("home")}/>;
      break;
    default:
      body = <div/>;
  }

  return (
    <div style={{
      width:360, height:720,
      background:T.paperAlt,
      border:`4px solid ${T.ink}`,
      borderRadius:44,
      overflow:"hidden",
      boxShadow:T.shadowLg,
      position:"relative",
    }}>
      {/* Dynamic island */}
      <div style={{
        position:"absolute", top:14, left:"50%", transform:"translateX(-50%)",
        width:90, height:22, background:T.ink, borderRadius:999, zIndex:20,
      }}/>
      <div style={{ width:"100%", height:"100%", borderRadius:36, overflow:"hidden", position:"relative", display:"flex", flexDirection:"column" }}>
        {/* Status bar */}
        <div style={{ height:46, flexShrink:0, display:"flex", alignItems:"flex-end",
          justifyContent:"space-between", padding:"0 24px 6px",
          fontFamily:T.mFont, fontWeight:700, fontSize:13, color:T.ink, background:T.paper }}>
          <div>9:41</div>
          <div style={{ display:"flex", alignItems:"center", gap:6 }}>
            <svg width="17" height="10" viewBox="0 0 17 10" aria-hidden="true">
              <rect x="0"    y="6" width="3" height="4"  rx="0.5" fill={T.ink}/>
              <rect x="4.5" y="4" width="3" height="6"  rx="0.5" fill={T.ink}/>
              <rect x="9"   y="2" width="3" height="8"  rx="0.5" fill={T.ink}/>
              <rect x="13.5" y="0" width="3" height="10" rx="0.5" fill={T.ink} opacity="0.35"/>
            </svg>
            <svg width="24" height="11" viewBox="0 0 24 11" aria-hidden="true">
              <rect x="0.75" y="0.75" width="19.5" height="9.5" rx="2.5" fill="none" stroke={T.ink} strokeWidth="1.2" opacity="0.9"/>
              <rect x="2" y="2" width="13" height="7" rx="1" fill={T.ink}/>
              <rect x="21.5" y="3.5" width="1.8" height="4" rx="0.6" fill={T.ink} opacity="0.6"/>
            </svg>
          </div>
        </div>
        {/* Screen body */}
        <div style={{ flex:1, minHeight:0, overflowY:"auto", background:T.paper, position:"relative" }}>
          {body}
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
