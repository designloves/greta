<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--paper);height:var(--app-height,100dvh);overflow:hidden;display:flex;align-items:flex-start;justify-content:center;font-family:'Space Grotesk',system-ui,sans-serif;}

/* ── Gummy Tech tokens ── */
:root{
  --app-height:100dvh;
  --paper:#F4F1E8; --paper-alt:#E9E4D2;
  --ink:#241F3D;   --ink-soft:#6B638A;
  --pink:#B583E8;  --pink-soft:#E5D4F7;
  --butter:#F2EE5B;--butter-soft:#FBF8B0;
  --sky:#8AD7FF;   --sky-soft:#D6F0FF;
  --mint:#A8F08C;  --mint-soft:#DFF7CE;
  --rose:#FFB0C8;
  --correct:#A8F08C; --wrong:#F46B7C;
  --radius:26px; --radius-lg:34px;
  --border:2.5px solid #241F3D;
  --border-thin:2px solid #241F3D;
  --shadow:0 6px 0 #241F3D;
  --shadow-lg:0 10px 0 #241F3D;
  --h-font:'Bricolage Grotesque',system-ui,sans-serif;
  --b-font:'Space Grotesk',system-ui,sans-serif;
  --m-font:'JetBrains Mono',ui-monospace,monospace;
}

/* ── App frame (fills the viewport) ── */
#frame{
  width:100%;max-width:520px;height:var(--app-height);background:var(--paper);
  position:relative;flex-shrink:0;
}
#shell{width:100%;height:100%;display:flex;flex-direction:column;}
#screen{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;background:var(--paper);position:relative;}

/* ── Cards ── */
.card{background:var(--paper);border:var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;}
.card-lg{background:var(--paper);border:var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:20px;}

/* ── Buttons ── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:var(--border);border-radius:var(--radius);
  font-family:var(--b-font);font-size:16px;font-weight:700;
  letter-spacing:-0.01em;cursor:pointer;outline:none;
  transition:transform 80ms,box-shadow 80ms;
  padding:12px 20px;
}
.btn:disabled{opacity:0.5;cursor:not-allowed;}
.btn-primary{background:var(--pink);color:#fff;box-shadow:0 4px 0 var(--ink);}
.btn-secondary{background:var(--butter);color:var(--ink);box-shadow:0 4px 0 var(--ink);}
.btn-tertiary{background:var(--paper);color:var(--ink);box-shadow:0 4px 0 var(--ink);}
.btn-lg{padding:16px 24px;font-size:18px;box-shadow:0 6px 0 var(--ink) !important;}
.btn-full{width:100%;}
.btn:not(:disabled):active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink) !important;}
.btn-sm{padding:8px 14px;font-size:14px;}

/* ── Icon-btn (round) ── */
.icon-btn{
  background:var(--paper-alt);border:var(--border-thin);border-radius:999px;
  width:38px;height:38px;cursor:pointer;display:flex;align-items:center;justify-content:center;outline:none;
}
.icon-btn-plain{
  background:none;border:none;box-shadow:none;
  width:36px;height:36px;cursor:pointer;display:flex;align-items:center;justify-content:center;outline:none;
}
.back-btn{
  background:none;border:none;box-shadow:none;cursor:pointer;outline:none;
  display:flex;align-items:center;gap:6px;padding:6px 4px;
  font-family:var(--b-font);font-size:15px;font-weight:700;color:var(--ink);
}

/* ── Toggle switch ── */
.switch{
  width:44px;height:26px;border-radius:999px;border:var(--border-thin);
  background:var(--paper-alt);position:relative;cursor:pointer;flex-shrink:0;
  padding:0;outline:none;transition:background 150ms, box-shadow 150ms, transform 150ms;
  box-shadow:0 3px 0 var(--ink);
}
.switch:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink);}
.switch[data-on="true"]{background:var(--mint);}
.switch::after{
  content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;
  border-radius:999px;background:#fff;border:var(--border-thin);
  transition:transform 150ms;
}
.switch[data-on="true"]::after{transform:translateX(18px);}
.avatar-swatch{transition:transform 150ms, box-shadow 150ms;}
.avatar-swatch:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink) !important;}

/* ── Inputs ── */
.inp{
  width:100%;padding:14px 18px;border:var(--border);border-radius:var(--radius);
  font-family:var(--b-font);font-size:16px;background:var(--paper);color:var(--ink);
  outline:none;box-shadow:inset 0 2px 0 var(--paper-alt);
}
.inp:focus{box-shadow:inset 0 2px 0 var(--paper-alt),0 0 0 3px var(--pink-soft);}
.inp-correct{background:var(--mint-soft)!important;}
.inp-wrong{background:var(--pink-soft)!important;}
.inp-mono{font-family:var(--m-font);font-size:16px;resize:none;line-height:1.6;}
.inp-header{font-family:var(--h-font);font-size:18px;}

/* ── Typography helpers ── */
.h-font{font-family:var(--h-font);}
.b-font{font-family:var(--b-font);}
.m-font{font-family:var(--m-font);}
.ink-soft{color:var(--ink-soft);}
.label-caps{font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-soft);}

/* ── Screen layout — one consistent padding scale for every screen ── */
.screen-pad{padding:16px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:32px;min-height:100%;}

/* ── Dot progress bar ── */
.dotbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.dot{height:10px;border-radius:6px;border:2px solid var(--ink);background:var(--paper-alt);transition:all 200ms;}
.dot-current{width:28px;background:var(--butter);}
.dot-done{width:10px;background:var(--mint);}
.dot-future{width:10px;}

/* ── Speech bubble ── */
.speech-bubble{
  position:absolute;top:6px;left:58%;transform:translate(-25%,-100%);
  background:var(--paper);border:var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:10px 16px;font-size:14px;font-weight:600;
  color:var(--ink);text-align:center;max-width:200px;z-index:5;
}
.speech-bubble::after{
  content:"";position:absolute;bottom:-9px;left:32%;
  width:16px;height:16px;background:var(--paper);
  border-right:var(--border);border-bottom:var(--border);
  transform:translateX(-50%) rotate(45deg);
}

/* ── Animations ── */

@keyframes bloom-spin{to{transform:rotate(360deg);}}

@keyframes greta-float{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-12px) rotate(8deg);}}

  0%  {transform:translate(0,0) scale(1) rotate(0);}
  20% {transform:translate(-30px,-30px) scale(1.1) rotate(-8deg);}
  40% {transform:translate(-58px,-78px) scale(1.25) rotate(-14deg);}
  55% {transform:translate(-62px,-88px) scale(1.3) rotate(-14deg);}
  70% {transform:translate(-58px,-78px) scale(1.2) rotate(-10deg);}
  100%{transform:translate(-20px,-20px) scale(1) rotate(0);opacity:.95;}

  15%{transform:translate(-8px,2px) rotate(-7deg);}
  30%{transform:translate(8px,2px) rotate(7deg);}
  45%{transform:translate(-7px,0) rotate(-6deg);}
  60%{transform:translate(7px,0) rotate(6deg);}
  75%{transform:translate(-4px,0) rotate(-3deg);}
}
@keyframes greta-heart-burst{
  0%  {transform:scale(0) rotate(-12deg);opacity:0;}
  35% {transform:scale(1.4) rotate(-6deg);opacity:1;}
  65% {transform:scale(1.1) rotate(2deg);opacity:1;}
  100%{transform:scale(.9) translateY(-18px) rotate(8deg);opacity:0;}

@keyframes greta-card-wrong{0%,100%{transform:translateX(0);}20%{transform:translateX(-7px);}40%{transform:translateX(7px);}60%{transform:translateX(-5px);}80%{transform:translateX(5px);}}
@keyframes greta-tada{
  0%  {transform:scale(1) rotate(0);}10%{transform:scale(.92) rotate(-6deg);}
  20%,40%,60%,80%{transform:scale(1.18) rotate(8deg);}

@keyframes greta-bigbounce{
  0%  {transform:translate(0,0) scale(1,1);}
  18% {transform:translate(0,-70px) scale(.94,1.12);}
  38% {transform:translate(0,0) scale(1.12,.86);}
  55% {transform:translate(0,-32px) scale(.97,1.06);}
  72% {transform:translate(0,0) scale(1.05,.95);}
  100%{transform:translate(0,0) scale(1,1);}
}
@keyframes greta-cartwheel{
  0%  {transform:translate(0,0) rotate(0) scale(1);}
  30% {transform:translate(-30px,-50px) rotate(-200deg) scale(.9);}
  60% {transform:translate(-60px,-40px) rotate(-380deg) scale(1);}
  100%{transform:translate(-20px,-10px) rotate(-360deg) scale(.95);}
}
@keyframes greta-sink{
  0%  {transform:translate(0,0) scale(1,1);}
  20% {transform:translate(0,6px) scale(1.05,.8);}
  40% {transform:translate(0,-2px) scale(.95,1.08);}
  60% {transform:translate(0,5px) scale(1.04,.86);}
  100%{transform:translate(0,0) scale(1,1);}
}
@keyframes greta-headtilt{0%{transform:rotate(0);}25%{transform:rotate(-22deg) translateX(-4px);}65%{transform:rotate(-22deg) translateX(-4px);}100%{transform:rotate(0);}}
@keyframes greta-spin-shrink{0%{transform:rotate(0) scale(1);}50%{transform:rotate(-540deg) scale(.55);}100%{transform:rotate(-720deg) scale(1);}}
@keyframes greta-sparkle-arc{
  0%  {transform:translate(0,0) scale(0) rotate(0);opacity:0;}
  30% {transform:translate(var(--dx,0px),var(--dy,0px)) scale(1.2) rotate(45deg);opacity:1;}
  100%{transform:translate(calc(var(--dx,0px)*1.7),calc(var(--dy,0px)*1.7 - 8px)) scale(.6) rotate(110deg);opacity:0;}

  0%  {transform:translate(var(--cdx,0px),-30px) rotate(0);opacity:0;}
  10% {opacity:1;}
  100%{transform:translate(calc(var(--cdx,0px) + var(--cdx2,0px)),320px) rotate(720deg);opacity:0;}

@keyframes greta-petal-trail{
  0%  {transform:translate(0,0) scale(0) rotate(0);opacity:0;}
  25% {transform:translate(var(--dx,0),var(--dy,0)) scale(1) rotate(var(--rot,0deg));opacity:1;}
  100%{transform:translate(calc(var(--dx,0)*1.4),calc(var(--dy,0)*1.4 + 24px)) scale(.6) rotate(calc(var(--rot,0deg) + 120deg));opacity:0;}

@keyframes greta-droplet-fall{0%{transform:scale(0);opacity:0;}20%{transform:scale(1);opacity:1;}100%{transform:translateY(28px) scale(.8);opacity:0;}}
@keyframes greta-qmark-pop{0%{transform:scale(0) rotate(-20deg);opacity:0;}35%{transform:scale(1.3) rotate(8deg);opacity:1;}100%{transform:scale(1.15) translateY(-12px) rotate(0);opacity:0;}}
@keyframes greta-puff{0%{transform:scale(0);opacity:0;}40%{transform:scale(1.2);opacity:.85;}100%{transform:scale(1.6);opacity:0;}}
@keyframes greta-answer-rise{from{transform:translateY(14px);opacity:0;}to{transform:translateY(0);opacity:1;}}
@keyframes pop-in{from{transform:scale(.92);opacity:0;}to{transform:scale(1);opacity:1;}}
@keyframes pop-out{from{transform:scale(1);opacity:1;}to{transform:scale(.85);opacity:0;}}

// ── VIEWPORT HEIGHT (tracks the visual viewport so the on-screen keyboard shrinks the app instead of covering it) ──
function syncAppHeight(){
  try{
    const h=window.visualViewport?window.visualViewport.height:window.innerHeight;
    document.documentElement.style.setProperty('--app-height',h+'px');
  }catch{}
}
// Some mobile browsers scroll the outer document itself when a focused
// input is covered by the keyboard, even with html/body set to
// overflow:hidden — snap it back so only the inner #screen ever scrolls.
function resetOuterScroll(){
  try{
    window.scrollTo(0,0);
    document.documentElement.scrollTop=0;
    document.body.scrollTop=0;
  }catch{}
}
syncAppHeight();
window.addEventListener('resize',syncAppHeight);
window.addEventListener('resize',resetOuterScroll);
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',syncAppHeight);
  window.visualViewport.addEventListener('scroll',syncAppHeight);
  window.visualViewport.addEventListener('resize',resetOuterScroll);
}

  if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')){

// ── AUTH ──────────────────────────────────────────────────────────
let currentUser=null, sessionToken=null;

function parseJWT(t){try{return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));}catch{return null;}}
function tokenExpired(t){const p=parseJWT(t);return!p?.exp||Date.now()/1000>p.exp-60;}
function saveSession(t,r){try{localStorage.setItem("greta_session",JSON.stringify({token:t,refresh:r}));}catch{}}
function clearSession(){try{localStorage.removeItem("greta_session");}catch{}currentUser=null;sessionToken=null;}

function applySession(token,refresh){
  const p=parseJWT(token);
  currentUser=p?{id:p.sub,email:p.email}:null;
  sessionToken=token;
  saveSession(token,refresh);
}

async function initAuth(){
  const params=new URLSearchParams(location.hash.substring(1));
  const ht=params.get("access_token"), hr=params.get("refresh_token");
  if(ht){applySession(ht,hr);try{history.replaceState(null,"",location.pathname+location.search);}catch{}return;}
  try{
    const saved=localStorage.getItem("greta_session");
    if(!saved)return;
    let{token,refresh}=JSON.parse(saved);
    if(tokenExpired(token)&&refresh){
      const res=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`,{
        method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_ANON_KEY},
        body:JSON.stringify({refresh_token:refresh}),
      });
      if(!res.ok){clearSession();return;}
      const d=await res.json();token=d.access_token;refresh=d.refresh_token;
    }else if(tokenExpired(token)){clearSession();return;}
    applySession(token,refresh);
  }catch{clearSession();}
}

// ── SETTINGS PERSISTENCE ─────────────────────────────────────────
const SETTINGS_KEY="poppins_settings_v1";
const PERSISTED_KEYS=["avatar","soundOn","pronunciationOn","pair","uiLang"];
function loadSettings(){
  try{
    const raw=localStorage.getItem(SETTINGS_KEY);
    return raw?JSON.parse(raw):{};
  }catch{return {};}
}
function saveSettings(){
  try{
    const out={};
    PERSISTED_KEYS.forEach(k=>out[k]=state[k]);
    localStorage.setItem(SETTINGS_KEY,JSON.stringify(out));
  }catch{}
}

const GUEST_LISTS_KEY="poppins_guest_lists_v1";
function loadGuestLists(){

    return raw?JSON.parse(raw):null;
  }catch{return null;}
}

function speak(text,lang){
  try{
    if(!window.speechSynthesis)return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    if(lang)u.lang=lang;
    speechSynthesis.speak(u);
  }catch{}
}

// ── SOUND EFFECTS (generated tones, no audio files needed) ───────
let audioCtx=null;
function getAudioCtx(){
  if(!audioCtx){
    try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch{}
  }
  return audioCtx;
}
function playTone(freq,duration,startTime,peak){
  const ctx=getAudioCtx(); if(!ctx)return;
  const osc=ctx.createOscillator(), gain=ctx.createGain();
  osc.type="sine"; osc.frequency.value=freq;
  const t0=ctx.currentTime+(startTime||0);
  gain.gain.setValueAtTime(0,t0);
  gain.gain.linearRampToValueAtTime(peak||0.2,t0+0.01);
  gain.gain.exponentialRampToValueAtTime(0.001,t0+duration);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t0); osc.stop(t0+duration+0.02);
}
function playCorrectSound(){
  if(!state.soundOn)return;
  playTone(523.25,0.12,0,0.18);
  playTone(783.99,0.16,0.09,0.18);
}
function playWrongSound(){
  if(!state.soundOn)return;
  playTone(220,0.22,0,0.16);
}

function speakCurrentWord(){
  if(!state.pronunciationOn)return;
  const list=activeList(); if(!list)return;
  const lh=langHelpers(list,state.quizReversed);
  const word=list.words[state.quizIdx]; if(!word)return;
  speak(lh.src(word),TTS_LOCALE[lh.from]);
}

  render();
}

async function sendMagicLink(){
  const email=state.loginEmail.trim();
  if(!email.includes("@")){setState({loginErr:"Enter a valid email"});return;}
  setState({loginErr:"",loginLoading:true});
  try{
    const res=await fetch(`${SUPABASE_URL}/auth/v1/otp`,{
      method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_ANON_KEY},
      body:JSON.stringify({email,create_user:true,options:{emailRedirectTo:location.href.split("#")[0]}}),
    });
    if(!res.ok){const d=await res.json();throw new Error(d.msg||d.error_description||"Could not send link");}
    setState({loginSent:true,loginLoading:false});
  }catch(e){setState({loginErr:e.message||"Could not send link",loginLoading:false});}
}

async function loadUserLists(){
  if(!sessionToken)return;
  try{
    const res=await fetch(`${API}/sets`,{headers:{"Authorization":`Bearer ${sessionToken}`}});
    if(!res.ok)return;
    const sets=await res.json();
    const COLORS=["rose","butter","sky","mint","pink"];
    const mapped=sets.map((s,i)=>({
      id:s.id,name:s.topic,color:COLORS[i%COLORS.length],
      words:s.vocab||[],
      from:s.lang_from||"sv",to:s.lang_to||"en",
    }));
    if(mapped.length>0)setState({lists:mapped,activeListId:mapped[0].id});
  }catch{}
}

async function saveList(newList){
  if(!sessionToken){
    setState({lists:[...state.lists,newList],activeListId:newList.id,screen:"home"});
    return;
  }
  try{
    const res=await fetch(`${API}/sets`,{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":`Bearer ${sessionToken}`},
      body:JSON.stringify({topic:newList.name,vocab:newList.words,lang_from:newList.from,lang_to:newList.to}),
    });
    const saved=await res.json();
    if(!res.ok)throw new Error(saved.error||"Save failed");
    const stamped={...newList,id:saved.id};
    setState({lists:[...state.lists,stamped],activeListId:stamped.id,screen:"home"});
  }catch(e){
    setState({lists:[...state.lists,newList],activeListId:newList.id,screen:"home"});
    alert(`${e.message||"Could not save to your account"} — kept on this device for now.`);
  }
}

async function updateList(id,patch){
  const lists=state.lists.map(l=>l.id===id?{...l,...patch}:l);
  setState({lists,activeListId:id,editingListId:null,screen:"home"});
  if(!sessionToken)return;
  const updated=lists.find(l=>l.id===id);
  try{
    const res=await fetch(`${API}/sets/${id}`,{
      method:"PATCH",
      headers:{"Content-Type":"application/json","Authorization":`Bearer ${sessionToken}`},
      body:JSON.stringify({topic:updated.name,vocab:updated.words,lang_from:updated.from,lang_to:updated.to}),
    });
    if(!res.ok){const d=await res.json().catch(()=>({}));throw new Error(d.error||"Could not save changes");}
  }catch(e){
    alert(`${e.message||"Could not save changes to your account"} — kept on this device for now.`);
  }
}

async function deleteList(list){
  const newLists=state.lists.filter(x=>x.id!==list.id);
  setState({lists:newLists,activeListId:state.activeListId===list.id?null:state.activeListId});
  if(!sessionToken)return;
  try{
    const res=await fetch(`${API}/sets/${list.id}`,{method:"DELETE",headers:{"Authorization":`Bearer ${sessionToken}`}});
    if(!res.ok){const d=await res.json().catch(()=>({}));throw new Error(d.error||"Could not delete");}
  }catch(e){
    alert(`${e.message||"Could not delete from your account"} — it may reappear next time your lists load.`);
  }
}

async function signOut(){
  if(sessionToken){
    fetch(`${SUPABASE_URL}/auth/v1/logout`,{method:"POST",headers:{"apikey":SUPABASE_ANON_KEY,"Authorization":`Bearer ${sessionToken}`}}).catch(()=>{});

// ── QUIZ LOGIC ────────────────────────────────────────────────────
const ANIM_CORRECT=["kiss","tada","bigbounce","cartwheel"];
const ANIM_WRONG  =["shake","sink","headtilt","spin"];

function quizSubmit(){
  const list=activeList(); if(!list||state.quizFeedback)return;
  const answer=state.quizAnswer.trim(); if(!answer)return;
  const lh=langHelpers(list,state.quizReversed);
  const word=list.words[state.quizIdx];
  const ok=answer.toLowerCase()===lh.tgt(word).toLowerCase();
  const pool=ok?ANIM_CORRECT:ANIM_WRONG;
  const anim=pool[Math.floor(Math.random()*pool.length)];
  if(ok){
    playCorrectSound();
    setState({quizRight:state.quizRight+1,quizFeedback:"correct",quizAnim:anim});
    setTimeout(quizAdvance,1200);
  }else{
    playWrongSound();
    setState({quizWrong:state.quizWrong+1,quizFeedback:"wrong",quizAnim:anim});
    setTimeout(()=>setState({quizWriteMode:true}),1400);
  }
}

function quizAdvance(){
  const list=activeList(); if(!list)return;
  const nextIdx=state.quizIdx+1;
  if(nextIdx>=list.words.length){
    setState({screen:"done",result:{right:state.quizRight,wrong:state.quizWrong,total:list.words.length}});
    return;
  }
  setState({quizIdx:nextIdx,quizAnswer:"",quizFeedback:null,quizAnim:null,quizWriteMode:false,quizReps:["","","","",""]});
  speakCurrentWord();
  setTimeout(()=>document.getElementById("quiz-input")?.focus(),50);
}

function write5Check(i,val){
  const list=activeList(); if(!list)return;
  const lh=langHelpers(list,state.quizReversed);
  const word=list.words[state.quizIdx];
  const target=lh.tgt(word).toLowerCase();
  const newReps=[...state.quizReps]; newReps[i]=val; setState({quizReps:newReps});
  if(val.trim().toLowerCase()===target&&i<4){
    setTimeout(()=>document.getElementById(`w5-${i+1}`)?.focus(),100);
  }
}

function splitPasteLine(line){
  const m=line.match(/^(.+?)\s*[=\-–→:\t]+\s*(.+)$/);
  if(m)return[m[1].trim(),m[2].trim()];
  const parts=line.split(/\s{2,}/);
  if(parts.length===2)return[parts[0].trim(),parts[1].trim()];
  return null;
}
function parsePasteText(text,pair){
  const lines=text.split("\n").map(l=>l.trim()).filter(Boolean);
  const out=[];
  for(const line of lines){
    const parts=splitPasteLine(line);
    if(parts)out.push({[pair.from]:parts[0],[pair.to]:parts[1]});
  }
  return out;
}

// Best-effort language guess from diacritics/marks — not real language
// detection, just enough to pre-fill the From/To pickers on a strong
// signal. Never fully trustworthy (e.g. unaccented text gives no signal
// at all), so it only nudges the pickers, which the user can override.
function guessLangCode(text){
  if(/[üÜß]/.test(text))return "de";
  if(/[åäöÅÄÖ]/.test(text))return "sv";
  if(/[ñÑ¿¡]/.test(text))return "es";
  if(/[çÇœŒàâêëîïôûÀÂÊËÎÏÔÛ]/.test(text))return "fr";
  if(/[áéíóúÁÉÍÓÚ]/.test(text))return "es";
  return null;
}
function guessPairFromText(text){
  const lines=text.split("\n").map(l=>l.trim()).filter(Boolean);
  let leftGuess=null,rightGuess=null;
  for(const line of lines){
    const parts=splitPasteLine(line); if(!parts)continue;
    if(!leftGuess)leftGuess=guessLangCode(parts[0]);
    if(!rightGuess)rightGuess=guessLangCode(parts[1]);
    if(leftGuess&&rightGuess)break;
  }
  if(leftGuess&&rightGuess&&leftGuess!==rightGuess)return{from:leftGuess,to:rightGuess};
  if(leftGuess&&!rightGuess)return{from:leftGuess,to:leftGuess==="en"?"sv":"en"};
  if(rightGuess&&!leftGuess)return{from:rightGuess==="en"?"sv":"en",to:rightGuess};
  return null;
}

// ── RENDER ────────────────────────────────────────────────────────
function render(){
  const sc=document.getElementById("screen");
  if(!sc)return;
  const active=document.activeElement;
  const focus=(active&&sc.contains(active)&&(active.tagName==="INPUT"||active.tagName==="TEXTAREA"))
    ?{id:active.id,start:active.selectionStart,end:active.selectionEnd}:null;
  sc.innerHTML=screens[state.screen]?screens[state.screen]():"";
  bindEvents();
  if(focus&&focus.id){
    const el=document.getElementById(focus.id);
    if(el){
      el.focus();
      if(typeof el.setSelectionRange==="function"&&focus.start!=null){
        try{el.setSelectionRange(focus.start,focus.end);}catch{}
      }
    }
  }
}

quiz(){

  const lh=langHelpers(list,quizReversed), word=list.words[quizIdx], total=list.words.length;

  if(quizWriteMode){

    return `

        <div style="text-align:center;">

  const mascotMood=quizFeedback==="correct"?(quizAnim==="tada"?"proud":"cheer"):quizFeedback==="wrong"?"oops":"happy";

  // mascot position & animation
  const isKiss=quizAnim==="kiss";
  const mascotStyle=isKiss
    ?`position:absolute;bottom:14px;right:50%;margin-right:-36px;transform-origin:center bottom;animation:${quizFeedback?`greta-kiss 1100ms cubic-bezier(.4,1.4,.6,1) both`:"none"};z-index:3;`
    :`position:absolute;bottom:-8px;right:-8px;transform-origin:center bottom;animation:${quizFeedback?`${animName(quizAnim)} both`:"none"};z-index:3;`;

  const burst=feedbackBurst(quizFeedback,quizAnim);

  const hint=!quizFeedback?`<div class="b-font" style="font-size:14px;color:var(--ink);opacity:.7;">${t("whatMeanIn",{lang:lh.tgtLang})}</div><div style="height:1px;width:40px;background:var(--ink);opacity:.2;"></div>`:"";

  return `

      <div style="display:flex;align-items:center;gap:10px;">
        <div style="flex:1;display:flex;flex-direction:column;gap:4px;">
          <div class="dotbar">${dots}</div>

        <div style="display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;min-height:0;overflow-y:auto;">

        ${quizFeedback?"readonly":""}/>
    </div>`;
},

// ── ANIMATION NAME HELPER ─────────────────────────────────────────
function animName(a){
  return {kiss:"greta-kiss 1100ms cubic-bezier(.4,1.4,.6,1)",tada:"greta-tada 950ms ease-in-out",bigbounce:"greta-bigbounce 1100ms ease-out",cartwheel:"greta-cartwheel 1000ms cubic-bezier(.5,.9,.5,1)",shake:"greta-oops 620ms ease-in-out",sink:"greta-sink 900ms ease-in-out",headtilt:"greta-headtilt 950ms ease-in-out",spin:"greta-spin-shrink 850ms cubic-bezier(.5,1.4,.5,1)"}[a]||"none";
}

// ── FEEDBACK BURST HTML ───────────────────────────────────────────
function feedbackBurst(feedback,anim){
  if(!feedback||!anim)return"";
  const colors=["#B583E8","#F2EE5B","#8AD7FF","#A8F08C","#FFB0C8"];
  if(anim==="kiss")return`<div style="position:absolute;inset:0;pointer-events:none;z-index:4;"><div style="position:absolute;bottom:78px;left:50%;margin-left:-14px;animation:greta-heart-burst 1100ms ease-out 250ms both;">${SVG.heart(32,"#B583E8")}</div></div>`;
  if(anim==="tada"){
    const dirs=[{dx:-55,dy:-40},{dx:55,dy:-40},{dx:-70,dy:0},{dx:70,dy:0},{dx:0,dy:-65}];
    return`<div style="position:absolute;inset:0;pointer-events:none;z-index:4;">${dirs.map((d,i)=>`<div style="position:absolute;left:50%;top:50%;--dx:${d.dx}px;--dy:${d.dy}px;animation:greta-sparkle-arc 900ms ease-out ${i*50}ms both;">${SVG.spark(22,colors[i])}</div>`).join("")}</div>`;
  }
  if(anim==="bigbounce"){
    const pieces=Array.from({length:18}).map((_,i)=>({cdx:(i*47)%320+"px",cdx2:(((i*13)%60)-30)+"px",delay:(i*35)%400,rot:(i*47)%360,color:colors[i%colors.length]}));
    return`<div style="position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden;">${pieces.map(p=>`<div style="position:absolute;top:0;left:0;--cdx:${p.cdx};--cdx2:${p.cdx2};animation:greta-confetti-rain 1200ms ease-in ${p.delay}ms both;">${SVG.confetti(9,p.color,p.rot)}</div>`).join("")}</div>`;
  }
  if(anim==="cartwheel"){
    const dirs=[{dx:-10,dy:-10,rot:0},{dx:-30,dy:-30,rot:40},{dx:-50,dy:-50,rot:80},{dx:-70,dy:-55,rot:120},{dx:-85,dy:-45,rot:160}];
    return`<div style="position:absolute;inset:0;pointer-events:none;z-index:4;">${dirs.map((d,i)=>`<div style="position:absolute;bottom:24px;right:24px;--dx:${d.dx}px;--dy:${d.dy}px;--rot:${d.rot}deg;animation:greta-petal-trail 1000ms ease-out ${i*80}ms both;">${SVG.bloom(20,colors[i%colors.length],"#F4F1E8",false)}</div>`).join("")}</div>`;
  }
  if(anim==="sink")return`<div style="position:absolute;inset:0;pointer-events:none;z-index:4;"><div style="position:absolute;bottom:38px;right:62px;animation:greta-droplet-fall 1000ms ease-in 200ms both;"><svg width="14" height="20" viewBox="0 0 14 20"><path d="M7 1 C 11 9 13 13 13 16 a6 6 0 0 1 -12 0 C 1 13 3 9 7 1 Z" fill="#8AD7FF"/><ellipse cx="9" cy="13" rx="1.5" ry="3" fill="#fff" opacity=".6"/></svg></div></div>`;
  if(anim==="headtilt")return`<div style="position:absolute;inset:0;pointer-events:none;z-index:4;"><div style="position:absolute;bottom:80px;right:26px;animation:greta-qmark-pop 1000ms ease-out 100ms both;font-family:var(--h-font);font-size:36px;color:var(--wrong);font-weight:700;">?</div></div>`;
  if(anim==="spin")return`<div style="position:absolute;inset:0;pointer-events:none;z-index:2;"><div style="position:absolute;bottom:-8px;right:-8px;width:110px;height:110px;border-radius:50%;background:var(--ink-soft);animation:greta-puff 850ms ease-out both;opacity:.5;"></div></div>`;
  return"";
}

    const list=activeList(); if(!list)return;
    const text=list.words.map(w=>`${w[list.from]||w.sv} = ${w[list.to]||w.en}`).join("\n");
    navigate("paste",{pasteName:list.name,pasteText:text,pasteParsed:[],pasteStep:"paste",editingListId:list.id,pair:{from:list.from||"sv",to:list.to||"en"},pasteAutoGuessed:true});

  on("lists-add","click",()=>navigate("paste",{pasteName:"",pasteText:"",pasteParsed:[],pasteStep:"paste",editingListId:null,pasteAutoGuessed:false}));
  document.querySelectorAll("[data-list-id]").forEach(el=>{
    el.addEventListener("click",e=>{
      if(e.target.closest(".list-delete"))return;
      setState({activeListId:el.dataset.listId,screen:"home"});
    });

  document.querySelectorAll(".list-delete").forEach(el=>{
    el.addEventListener("click",e=>{
      e.stopPropagation();
      const list=state.lists.find(l=>l.id===el.dataset.deleteId);
      if(list&&confirm("Permanently delete project?"))deleteList(list);
    });

  on("paste-text","input",e=>setState({pasteText:e.target.value}));
  on("paste-from","change",e=>{
    const pair={...state.pair,from:e.target.value};
    setState({pair,pasteAutoGuessed:true,pasteParsed:parsePasteText(state.pasteText,pair)});
  });
  on("paste-to","change",e=>{
    const pair={...state.pair,to:e.target.value};
    setState({pair,pasteAutoGuessed:true,pasteParsed:parsePasteText(state.pasteText,pair)});
  });
  on("paste-parse","click",()=>{
    const guess=!state.pasteAutoGuessed&&guessPairFromText(state.pasteText);
    const pair=guess||state.pair;
    const parsed=parsePasteText(state.pasteText,pair);
    setState({pasteParsed:parsed,pasteStep:"review",pair,pasteAutoGuessed:true});
  });

      updateList(state.editingListId,{name:state.pasteName||"My new list",words:state.pasteParsed,from:state.pair.from,to:state.pair.to});
    }else{

  });

  on("done-home",  "click",()=>navigate("home"));
  on("done-again", "click",()=>{navigate("quiz",{quizIdx:0,quizRight:0,quizWrong:0,quizAnswer:"",quizFeedback:null,quizAnim:null,quizWriteMode:false,quizReps:["","","","",""]});speakCurrentWord();});

  on("settings-close", "click",()=>navigate("home"));
  on("settings-logout","click",signOut);
  on("settings-login","click",()=>navigate("login",{loginEmail:"",loginSent:false,loginErr:""}));
  document.querySelectorAll(".avatar-swatch").forEach(el=>{
    el.addEventListener("click",()=>setState({avatar:el.dataset.avatar}));
  });
  document.querySelectorAll(".ui-lang-btn").forEach(el=>{
    el.addEventListener("click",()=>setState({uiLang:el.dataset.lang}));
  });
  document.querySelectorAll(".switch[data-setting]").forEach(el=>{
    el.addEventListener("click",()=>{
      const key=el.dataset.setting;
      setState({[key]:!state[key]});
    });
  });
}

function on(id,evt,fn){const el=document.getElementById(id);if(el)el.addEventListener(evt,fn);}

// ── BOOT ──────────────────────────────────────────────────────────
window.addEventListener('unhandledrejection',e=>{
  const msg=e.reason?.stack||e.reason?.message||String(e.reason);
  const sc=document.getElementById('screen');
  if(sc)sc.innerHTML=`<div style="padding:16px;font-family:monospace;font-size:11px;color:#c00;word-break:break-all;white-space:pre-wrap;background:#fff5f5;border:2px solid #c00;margin:12px;border-radius:8px;"><strong>Debug error — screenshot this:</strong>\n\n${msg}</div>`;
});

(async()=>{
  try{await initAuth();}catch{}
  if(sessionToken){
    try{await loadUserLists();}catch{}
  }else{
    const guest=loadGuestLists();
    if(guest?.lists?.length)Object.assign(state,guest);
  }
  try{render();}catch(e){console.error('[Poppins] render error:',e);}
})().catch(e=>console.error('[Poppins] boot error:',e));
</script>
</body>
</html>
